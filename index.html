<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Conx Ops">
<meta name="theme-color" content="#14171C">
<title>Conx Ops</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
  :root{
    --bg:#14171C;
    --panel:#1B1F26;
    --panel-2:#20252D;
    --line:#2A3038;
    --text:#E8E9EB;
    --text-dim:#8B92A0;
    --indigo:#3C4BA0;
    --indigo-soft:#4C5DC4;
    --amber:#D9A441;
    --green:#4A9B6E;
    --red:#C4544B;
    color-scheme: dark;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; height:100%; overflow:hidden; -webkit-text-size-adjust:100%;}
  #app{display:flex; flex-direction:column; height:100%;}

  header{
    padding:18px max(20px, env(safe-area-inset-right,0px)) 14px max(20px, env(safe-area-inset-left,0px));
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand .mark{
    font-family:'Barlow Semi Condensed','Inter',sans-serif;
    font-weight:700; font-size:22px; letter-spacing:0.5px;
    color:var(--text);
  }
  .brand .sub{
    font-size:11px; color:var(--text-dim); letter-spacing:1.5px; text-transform:uppercase;
    font-family:'SFMono-Regular',Consolas,monospace;
  }
  .clock{font-family:'SFMono-Regular',Consolas,monospace; font-size:12px; color:var(--text-dim);}

  main{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px max(16px, env(safe-area-inset-right,0px)) 100px max(16px, env(safe-area-inset-left,0px));}

  nav.tabs{
    position:fixed; bottom:0; left:0; right:0;
    display:flex; background:var(--panel);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);
    padding-left:max(0px, env(safe-area-inset-left,0px)); padding-right:max(0px, env(safe-area-inset-right,0px));
    z-index:10;
  }
  nav.tabs button{
    flex:1; background:none; border:none; color:var(--text-dim);
    padding:12px 4px 10px 4px; font-size:11px; font-family:inherit;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    letter-spacing:0.3px;
  }
  nav.tabs button .dot{width:6px; height:6px; border-radius:50%; background:transparent;}
  nav.tabs button.active{color:var(--text);}
  nav.tabs button.active .dot{background:var(--indigo-soft);}

  .section-title{
    font-family:'Barlow Semi Condensed','Inter',sans-serif; font-weight:600;
    font-size:19px; margin:4px 0 14px 0; letter-spacing:0.2px;
  }

  /* Overview */
  .grid-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px;}
  .stat{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:14px 12px;
  }
  .stat .n{font-family:'Barlow Semi Condensed',sans-serif; font-size:28px; font-weight:700;}
  .stat .l{font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.6px; margin-top:2px;}
  .stat.warn .n{color:var(--amber);}
  .stat.crit .n{color:var(--red);}

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:14px 15px; margin-bottom:10px;
  }
  .card .row1{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .card .title{font-weight:600; font-size:15px;}
  .card .meta{font-size:12.5px; color:var(--text-dim); margin-top:3px; line-height:1.5;}
  .badge{
    font-size:10.5px; font-weight:600; padding:3px 8px; border-radius:20px;
    text-transform:uppercase; letter-spacing:0.4px; white-space:nowrap;
    display:flex; align-items:center; gap:5px;
  }
  .badge .dot{width:6px; height:6px; border-radius:50%;}
  .badge.ok{background:rgba(74,155,110,0.15); color:var(--green);}
  .badge.ok .dot{background:var(--green);}
  .badge.warn{background:rgba(217,164,65,0.15); color:var(--amber);}
  .badge.warn .dot{background:var(--amber);}
  .badge.crit{background:rgba(196,84,75,0.15); color:var(--red);}
  .badge.crit .dot{background:var(--red);}
  .badge.neutral{background:rgba(139,146,160,0.15); color:var(--text-dim);}
  .badge.neutral .dot{background:var(--text-dim);}

  .empty{
    text-align:center; padding:50px 20px; color:var(--text-dim);
  }
  .empty .big{font-size:15px; color:var(--text); margin-bottom:4px;}
  .empty .small{font-size:13px;}

  .fab{
    position:fixed; bottom:calc(78px + env(safe-area-inset-bottom,0px)); right:max(18px, env(safe-area-inset-right,0px)); z-index:9;
    width:52px; height:52px; border-radius:50%;
    background:var(--indigo); border:none; color:#fff;
    font-size:26px; box-shadow:0 4px 14px rgba(60,75,160,0.5);
    display:flex; align-items:center; justify-content:center;
  }

  .filter-row{display:flex; gap:8px; overflow-x:auto; margin-bottom:14px; padding-bottom:2px;}
  .filter-row::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0; background:var(--panel); border:1px solid var(--line); color:var(--text-dim);
    padding:6px 13px; border-radius:20px; font-size:12.5px; font-family:inherit;
  }
  .chip.active{background:var(--indigo); border-color:var(--indigo); color:#fff;}

  /* Modal */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:20;
    display:flex; align-items:flex-end;
  }
  .modal{
    background:var(--panel-2); width:100%; max-height:88vh; overflow-y:auto;
    border-radius:18px 18px 0 0; padding:18px max(18px, env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px, env(safe-area-inset-left,0px));
    animation:slideup 0.22s ease-out;
  }
  @keyframes slideup{from{transform:translateY(24px); opacity:0.4;} to{transform:translateY(0); opacity:1;}}
  .modal h2{font-family:'Barlow Semi Condensed',sans-serif; font-size:20px; margin:2px 0 16px 0;}
  .modal-error{
    background:rgba(196,84,75,0.15); border:1px solid rgba(196,84,75,0.4); color:#E88880;
    padding:10px 12px; border-radius:8px; font-size:13px; margin:-6px 0 14px 0;
  }
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; background:var(--panel); border:1px solid var(--line); color:var(--text);
    padding:11px 12px; border-radius:8px; font-size:15px; font-family:inherit;
  }
  .field textarea{resize:vertical; min-height:60px;}
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}
  .modal-actions{display:flex; gap:10px; margin-top:16px;}
  .btn{
    flex:1; padding:13px; border-radius:9px; border:none; font-size:15px; font-weight:600;
    font-family:inherit;
  }
  .btn-primary{background:var(--indigo); color:#fff;}
  .btn-ghost{background:var(--panel); color:var(--text-dim); border:1px solid var(--line);}
  .btn-danger{background:rgba(196,84,75,0.15); color:var(--red);}
  .card{position:relative;}
  .card:active{opacity:0.85;}
  .loading{text-align:center; padding:60px; color:var(--text-dim); font-size:13px;}

  .mini-btn{
    margin-top:10px; background:none; border:1px solid var(--indigo-soft); color:var(--indigo-soft);
    padding:7px 12px; border-radius:7px; font-size:12.5px; font-family:inherit; font-weight:600;
  }
  .ai-btn{
    background:none; border:none; color:var(--indigo-soft); font-size:11.5px; font-weight:600;
    font-family:inherit; padding:0; text-transform:none; letter-spacing:0;
  }
  .ai-btn:disabled{color:var(--text-dim);}

  .hdr-right{display:flex; align-items:center; gap:12px;}
  .hdr-btn{background:var(--panel); border:1px solid var(--line); color:var(--text); padding:6px 12px; border-radius:7px; font-size:12.5px; font-weight:600; font-family:inherit;}
  .data-block{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px;}
  .data-title{font-weight:600; font-size:14.5px; margin-bottom:3px;}
  .data-sub{font-size:12.5px; color:var(--text-dim); margin-bottom:12px; line-height:1.5;}
  .data-row{display:flex; gap:8px; flex-wrap:wrap;}
  .data-row .btn{flex:1 1 40%;}
  .file-btn{display:block; text-align:center; cursor:pointer;}
  .data-msg{padding:10px 12px; border-radius:8px; font-size:13px; margin:-6px 0 14px 0;}
  .data-msg.ok{background:rgba(74,155,110,0.15); border:1px solid rgba(74,155,110,0.4); color:#7FCB9E;}
  .data-msg.err{background:rgba(196,84,75,0.15); border:1px solid rgba(196,84,75,0.4); color:#E88880;}
  /* Report preview */
  .report-overlay{
    position:fixed; inset:0; background:var(--bg); z-index:30;
    display:flex; flex-direction:column;
  }
  .report-toolbar{
    display:flex; gap:10px; padding:14px max(16px, env(safe-area-inset-right,0px)) 14px max(16px, env(safe-area-inset-left,0px));
    padding-top:calc(14px + env(safe-area-inset-top,0px)); border-bottom:1px solid var(--line); flex-shrink:0; align-items:center;
  }
  .report-toolbar .close-btn{
    background:none; border:none; color:var(--text-dim); font-size:22px; padding:0 6px 0 0;
  }
  .report-toolbar .spacer{flex:1;}
  .report-toolbar button.act{
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    padding:9px 14px; border-radius:8px; font-size:13px; font-family:inherit; font-weight:600;
  }
  .report-toolbar button.act.primary{background:var(--indigo); border-color:var(--indigo); color:#fff;}
  .report-scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:24px 16px 60px 16px;}
  .report-doc{
    background:#fff; color:#1a1a1a; max-width:720px; margin:0 auto; padding:36px 32px;
    border-radius:4px; font-family:'Inter',-apple-system,sans-serif;
  }
  .report-doc .rhead{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:3px solid #3C4BA0; padding-bottom:16px; margin-bottom:22px;}
  .report-doc .rlogo{height:30px; width:auto; display:block; margin-bottom:4px;}
  .report-doc .rsub{font-size:10.5px; color:#666; letter-spacing:1.5px; text-transform:uppercase; margin-top:2px;}
  .report-doc .rtitle{text-align:right; font-family:'Barlow Semi Condensed',sans-serif; font-weight:700; font-size:15px; color:#1a1a1a; letter-spacing:0.5px;}
  .report-doc .rtitle .rdate{font-family:'Inter',sans-serif; font-weight:400; font-size:11.5px; color:#777; margin-top:2px;}
  .rgrid{display:grid; grid-template-columns:1fr 1fr; gap:0; border:1px solid #e2e2e2; border-radius:6px; overflow:hidden; margin-bottom:22px;}
  .rgrid .rcell{padding:10px 14px; border-bottom:1px solid #e2e2e2; border-right:1px solid #e2e2e2;}
  .rgrid .rcell:nth-child(2n){border-right:none;}
  .rgrid .rcell .rlabel{font-size:10px; text-transform:uppercase; letter-spacing:0.5px; color:#999;}
  .rgrid .rcell .rval{font-size:14px; margin-top:2px; font-weight:500;}
  .rblock{margin-bottom:20px;}
  .rblock .rblabel{font-family:'Barlow Semi Condensed',sans-serif; font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:0.6px; color:#3C4BA0; margin-bottom:6px;}
  .rblock .rbtext{font-size:14px; line-height:1.6; white-space:pre-wrap; color:#2a2a2a;}
  .rsign{display:flex; gap:30px; margin-top:36px; padding-top:20px; border-top:1px solid #e2e2e2;}
  .rsign .sline{flex:1;}
  .rsign .sline .sname{border-top:1px solid #999; padding-top:6px; font-size:12.5px; color:#555;}

  .banner{
    flex-shrink:0; padding:9px max(16px, env(safe-area-inset-right,0px)) 9px max(16px, env(safe-area-inset-left,0px));
    background:rgba(217,164,65,0.12); color:var(--amber); font-size:12.5px; line-height:1.45;
    border-bottom:1px solid var(--line);
  }
  .toast{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(84px + env(safe-area-inset-bottom,0px)); max-width:min(92vw, 420px);
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:10px 14px; border-radius:9px; font-size:13px; line-height:1.4; z-index:60;
    box-shadow:0 6px 20px rgba(0,0,0,0.4);
  }
  .ai-note{font-size:12px; color:var(--amber); margin-top:6px;}
  .ai-note:empty{display:none;}
  .btn:disabled, .report-toolbar button.act:disabled{opacity:0.6;}
  @media (max-width:520px){
    .clock, .brand .sub{display:none;}
  }

  .login{height:100%; display:flex; align-items:center; justify-content:center; padding:24px;}
  .login form{width:100%; max-width:340px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:24px;}
  .login input{width:100%; box-sizing:border-box;}
</style>
</head>

const CONTRACT_STATUS = c => {
  const days = Math.ceil((new Date(c.endDate) - new Date()) / 86400000);
  if(days < 0) return {status:'expired', label:'Expired', cls:'crit', days};
  if(days <= 30) return {status:'due', label:`${days}d left`, cls:'warn', days};
  return {status:'active', label:'Active', cls:'ok', days};
};
const TICKET_STATUS_CLS = {Open:'crit', 'In Progress':'warn', Resolved:'ok'};
const PRIORITY_CLS = {High:'crit', Medium:'warn', Low:'neutral'};

let state = {
  tab: 'overview',
  contracts: [],
  clients: [],
  tickets: [],
  reports: [],
  loaded: false,
  modal: null, // {type:'contract'|'client'|'ticket'|'reportForm', data:{...}, isNew:bool}
  dataOpen: false,
  dataMsg: null,
  importPending: null,
  saving: false,
  needLogin: false,
  backupEmail: '',
  backupBusy: false,
  readOnly: false,
  mode: 'loading', // 'sync' (shared database) or 'local' (this device only)
  syncError: null,
  confirmReportDelete: false,
  reportView: null, // report object currently open in full-screen preview
  filter: 'all'
};

// ---- Data layer: Supabase (Postgres + Realtime + Auth) ----
const KINDS = ['contracts', 'clients', 'tickets', 'reports'];
const KIND_OF = {contract:'contracts', client:'clients', ticket:'tickets', reportForm:'reports'};
let SB = null, SAMPLE = null, DOWNLOADS = null;
const firstSeen = new Set();
const sleep = ms => new Promise(r => setTimeout(r, ms));

function toast(text){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4500);
}

// Live updates must never wipe a form someone is filling in
function softRender(){
  if(state.modal || state.dataOpen || state.reportView) return;
  render();
}

function applyChange(kind, id, row){
  if(!KINDS.includes(kind)) return;
  state[kind] = row
    ? (state[kind].some(x => x.id === id) ? state[kind].map(x => x.id === id ? row : x) : [...state[kind], row])
    : state[kind].filter(x => x.id !== id);
}

async function loadAllRows(){
  const rows = [];
  for(let from = 0; ; from += 1000){
    const {data, error} = await SB.from('records').select('kind,id,data').range(from, from + 999);
    if(error) throw error;
    rows.push(...data);
    if(data.length < 1000) break;
  }
  KINDS.forEach(k => state[k] = []);
  rows.forEach(r => { if(KINDS.includes(r.kind)) state[r.kind].push({...r.data, id: r.id}); });
}

let channel = null;
function startRealtime(){
  if(channel) SB.removeChannel(channel);
  channel = SB.channel('records-live')
    .on('postgres_changes', {event: '*', schema: 'public', table: 'records'}, p => {
      if(p.eventType === 'DELETE'){ const o = p.old || {}; if(o.kind && o.id) applyChange(o.kind, o.id, null); }
      else { const n = p.new; applyChange(n.kind, n.id, {...n.data, id: n.id}); }
      softRender();
    })
    .subscribe(status => {
      if(status === 'SUBSCRIBED'){ state.syncError = null; loadAllRows().then(softRender).catch(() => {}); }
      else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT'){ state.syncError = 'offline'; softRender(); }
    });
}

async function doLogin(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const {error} = await SB.auth.signInWithPassword({email: String(fd.get('email')).trim(), password: String(fd.get('password'))});
  if(error){ document.getElementById('app').innerHTML = loginHTML('Wrong email or password.'); return; }
  await enter();
}
async function signOut(){
  await SB.auth.signOut();
  if(channel){ SB.removeChannel(channel); channel = null; }
  KINDS.forEach(k => state[k] = []);
  state.loaded = false; state.needLogin = true; state.modal = null; state.dataOpen = false; state.reportView = null;
  render();
}

async function enter(){
  state.needLogin = false; state.loaded = false; state.syncError = null;
  render();
  try{ await loadAllRows(); }
  catch(e){ state.syncError = 'load failed'; KINDS.forEach(k => state[k] = state[k] || []); }
  state.loaded = true;
  state.mode = 'sync';
  loadBackupEmail().then(() => softRender());
  render();
  startRealtime();
}

async function init(){
  const cfg = window.CONX_CONFIG || {};
  if(!cfg.supabaseUrl || !cfg.supabaseAnonKey || cfg.supabaseUrl.includes('YOUR-PROJECT')){
    document.getElementById('app').innerHTML = `<div class="loading" style="padding:24px; text-align:center;">Supabase is not set up yet.<br>Open <b>config.js</b> and paste your project URL and anon key (see README).</div>`;
    return;
  }
  if(!window.supabase){
    document.getElementById('app').innerHTML = `<div class="loading">Could not load the Supabase library. Check your connection and reload.</div>`;
    return;
  }
  SB = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  if(cfg.rewriteFunction){
    SAMPLE = async prompt => {
      const {data, error} = await SB.functions.invoke('rewrite', {body: {prompt}});
      if(error || !data || !data.text) throw {code: 'unavailable'};
      return {text: data.text};
    };
  }
  state.needLogin = true;
  render();
  const {data} = await SB.auth.getSession();
  if(data && data.session) await enter();
  SB.auth.onAuthStateChange(ev => { if(ev === 'SIGNED_OUT' && !state.needLogin){ state.needLogin = true; state.loaded = false; render(); } });
}

async function loadBackupEmail(){
  try{
    const {data} = await SB.from('app_settings').select('value').eq('key', 'backup_email').maybeSingle();
    state.backupEmail = (data && data.value) || '';
  }catch(e){ state.backupEmail = state.backupEmail || ''; }
}
async function saveBackupEmail(){
  const el = document.getElementById('backupEmailInput');
  const v = (el ? el.value : '').trim();
  if(v && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){ state.dataMsg = {kind:'err', text:'That does not look like an email address.'}; render(); return; }
  const {error} = v
    ? await SB.from('app_settings').upsert({key:'backup_email', value:v}, {onConflict:'key'})
    : await SB.from('app_settings').delete().eq('key','backup_email');
  if(error){ state.dataMsg = {kind:'err', text:'Could not save the email. Did you run the backup SQL in step 2 of the backup guide?'}; render(); return; }
  state.backupEmail = v;
  state.dataMsg = {kind:'ok', text: v ? 'Saved. A backup will be emailed on the 1st of every month.' : 'Monthly backup email removed.'};
  render();
}
async function sendBackupNow(){
  if(state.backupBusy) return;
  state.backupBusy = true;
  state.dataMsg = {kind:'ok', text:'Sending…'};
  render();
  try{
    const {data, error} = await SB.functions.invoke('monthly-backup', {body: {manual: true}});
    if(error || !data || !data.ok) throw new Error((data && data.error) || 'failed');
    state.dataMsg = {kind:'ok', text:'Backup sent to ' + data.to + '. Check your inbox (and spam).'};
  }catch(e){
    state.dataMsg = {kind:'err', text:'Could not send. Save the email first, and check the backup function is deployed.'};
  }
  state.backupBusy = false;
  render();
}

async function upsert(kind, obj){
  state[kind] = state[kind].some(x => x.id === obj.id)
    ? state[kind].map(x => x.id === obj.id ? obj : x)
    : [...state[kind], obj];
  const {error} = await SB.from('records').upsert({kind, id: obj.id, data: obj, updated_at: new Date().toISOString()}, {onConflict: 'kind,id'});
  if(error) throw error;
}
async function removeRecord(kind, id){
  state[kind] = state[kind].filter(x => x.id !== id);
  const {error} = await SB.from('records').delete().eq('kind', kind).eq('id', id);
  if(error) throw error;
}
function writeError(err){
  const code = err && err.code;
  if(code === '42501' || code === 'PGRST301' || code === '401') return 'Your session expired. Sign out, sign in again, and retry.';
  return 'Could not save. Check your connection and try again.';
}

// Report serial numbers come from a Postgres function, so two devices can never get the same one
function localMaxSerial(){
  let max = 700;
  state.reports.forEach(r => { const n = parseInt(r.serialNo, 10); if(!isNaN(n) && n > max) max = n; });
  return max;
}
function nextSerialNo(){ return localMaxSerial() + 1; }
async function claimSerial(){
  const {data, error} = await SB.rpc('next_serial');
  if(error || data == null) throw error || new Error('serial');
  return Number(data);
}

function cid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function setTab(t){ state.tab = t; state.filter='all'; render(); }

function openModal(type, data, isNew){
  state.modal = {type, data: data ? {...data} : {}, isNew};
  if(type === 'reportForm' && !state.modal.data.serialNo){
    state.modal.suggestedSerial = String(nextSerialNo());
    state.modal.data.serialNo = state.modal.suggestedSerial;
  }
  render();
}
function closeModal(){ state.modal = null; render(); }

const REQUIRED_FIELDS = {
  contract: [['client','Client'], ['endDate','End date']],
  client: [['name','Name']],
  ticket: [['client','Client'], ['issue','Issue']],
  reportForm: [['client','Client'], ['workCarriedOut','Work carried out']]
};

async function submitModal(e){
  e.preventDefault();
  if(state.saving) return;
  const form = e.target;
  const fd = new FormData(form);
  const obj = {};
  fd.forEach((v,k) => obj[k] = v);
  const {type, isNew} = state.modal;

  const reqs = REQUIRED_FIELDS[type] || [];
  const missing = reqs.filter(([key]) => !(obj[key] || '').trim()).map(([,label]) => label);
  if(missing.length){
    state.modal.error = `Please fill in: ${missing.join(', ')}`;
    render();
    return;
  }

  obj.id = state.modal.data.id || cid();
  state.saving = true;
  try{
    if(type === 'reportForm'){
      obj.createdAt = new Date().toISOString();
      if(String(obj.serialNo) === state.modal.suggestedSerial) obj.serialNo = String(await claimSerial());
    }
    await upsert(KIND_OF[type], obj);
  }catch(err){
    state.saving = false;
    state.modal.error = writeError(err);
    render();
    return;
  }
  state.saving = false;
  if(type === 'reportForm'){
    state.modal = null;
    state.reportView = obj;
    render();
    return;
  }
  closeModal();
}

async function deleteCurrent(){
  const {type, data} = state.modal;
  if(!state.modal.confirmDelete){ state.modal.confirmDelete = true; render(); return; }
  try{
    await removeRecord(KIND_OF[type], data.id);
  }catch(err){
    state.modal.error = writeError(err);
    state.modal.confirmDelete = false;
    render();
    return;
  }
  closeModal();
}

function openReportForm(prefill){
  state.modal = null;
  openModal('reportForm', prefill || {}, true);
}

async function deleteReport(id){
  if(!state.confirmReportDelete){ state.confirmReportDelete = true; render(); return; }
  state.confirmReportDelete = false;
  try{ await removeRecord('reports', id); }
  catch(err){ toast(writeError(err)); }
  state.reportView = null;
  render();
}

          <span>Work carried out — one point per line</span>
          ${SAMPLE ? `<button type="button" class="ai-btn" id="rewriteBtn" onclick="rewriteWorkPerformed()">&#10024; Rewrite with AI</button>` : ''}
        </label>
        <textarea name="workCarriedOut" id="workPerformedInput" rows="5" placeholder="One line per item, e.g.&#10;We have checked...&#10;All devices found in working condition&#10;Start a line with ! to flag it as an issue (highlighted)" >${esc(data.workCarriedOut)}</textarea>
        <div class="ai-note" id="aiNote"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Spares replaced, if any</label><input name="sparesReplaced" value="${esc(data.sparesReplaced || 'None')}"></div>
        <div class="field"><label>Work status</label>
          <select name="workStatus">${['Completed','Pending'].map(s=>`<option ${data.workStatus===s?'selected':''}>${s}</option>`).join('')}</select>
        </div>
      </div>
      <div class="field"><label>If pending, reason</label><input name="pendingReason" value="${esc(data.pendingReason)}"></div>
      <div class="row2">
        <div class="field"><label>Engineer</label>
          <select name="engineer">${ENGINEERS.map(e=>`<option ${data.engineer===e?'selected':''}>${e}</option>`).join('')}</select>
        </div>

      </div>
      <div class="field"><label>Checked by (optional)</label><input name="checkedBy" value="${esc(data.checkedBy)}"></div>
    `;
  }

  return `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h2>${title}</h2>
        ${state.modal.error ? `<div class="modal-error">${esc(state.modal.error)}</div>` : ''}
        <form onsubmit="submitModal(event)">
          ${fields}
          <div class="modal-actions">
            ${!isNew && !state.readOnly ? `<button type="button" class="btn btn-danger" onclick="deleteCurrent()">${state.modal.confirmDelete ? 'Tap again to delete' : 'Delete'}</button>` : ''}
            <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
            ${state.readOnly ? '' : `<button type="submit" class="btn btn-primary">Save</button>`}
          </div>
        </form>
      </div>
    </div>
  `;
}

    <tr>

function loadScript(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = () => reject(new Error('load failed'));
    document.head.appendChild(s);
  });
}
async function ensurePdfLibs(){
  if(!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  if(!(window.jspdf && window.jspdf.jsPDF)) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
}

async function downloadReportPDF(){
  const r = state.reportView;
  if(!r) return;
  const btn = document.getElementById('pdfBtn');
  const label = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Making PDF…'; }
  let host = null;
  try{
    await ensurePdfLibs();
    // Render from a fixed-width copy so the PDF looks the same on a phone and an iPad
    host = document.createElement('div');
    host.style.cssText = 'position:absolute; left:-10000px; top:0; width:720px; background:#fff;';
    host.innerHTML = reportTableHTML(r);
    document.body.appendChild(host);
    const canvas = await window.html2canvas(host, {scale: 3, backgroundColor: '#ffffff', useCORS: true, logging: false});
    const pdf = new window.jspdf.jsPDF({unit: 'mm', format: 'a4', compress: true});
    const pageW = 210, pageH = 297, m = 12;
    const imgW = pageW - 2 * m;
    const imgH = canvas.height * imgW / canvas.width;
    const usable = pageH - 2 * m;
    const img = canvas.toDataURL('image/png');
    const pages = Math.max(1, Math.ceil(imgH / usable - 0.001));
    for(let i = 0; i < pages; i++){
      if(i > 0) pdf.addPage();
      pdf.addImage(img, 'PNG', m, m - i * usable, imgW, imgH);
      if(pages > 1){
        pdf.setFillColor(255, 255, 255);
        pdf.rect(0, 0, pageW, m, 'F');
        pdf.rect(0, pageH - m, pageW, m, 'F');
      }
    }
    const safeClient = (r.client || 'Client').replace(/[^a-z0-9]+/gi, '_').replace(/^_|_$/g, '');
    await saveFile(`SR-${r.serialNo || 'draft'}_${safeClient}.pdf`, pdf.output('blob'), 'application/pdf');
  }catch(e){
    toast('Could not make the PDF. Check your connection and try again.');
  }finally{
    if(host) host.remove();
    if(btn){ btn.disabled = false; btn.textContent = label; }
  }
}

function autofillPmsDesc(system){

async function rewriteWorkPerformed(){
  if(!SAMPLE) return;
  const btn = document.getElementById('rewriteBtn');
  const note = document.getElementById('aiNote');
  const systemEl = document.getElementById('systemAttendedInput');
  const workEl = document.getElementById('workPerformedInput');
  if(!workEl || !btn) return;
  const rough = workEl.value.trim();
  if(!rough){
    workEl.focus();
    if(note) note.textContent = 'Type your rough notes first, then tap Rewrite.';
    return;
  }
  const system = systemEl ? systemEl.value : '';
  const label = btn.innerHTML;
  btn.disabled = true;
  btn.textContent = 'Rewriting…';
  if(note) note.textContent = '';
  const prompt = [
    'You are helping a field engineer at a CCTV / fire alarm / access control system integration company write the "Work Carried Out" section of a preventive maintenance service report for a ' + (system || 'system') + '.',
    '',
    'Rough notes from the engineer:',
    rough,
    '',
    'Rewrite these into short, plain, field-report style lines, one point per line, matching this tone and register:',
    '"We have checked the gauge pressure of extinguisher, found all are in range"',
    '"32 channel NVR working normal"',
    '"All the accessories are in good condition"',
    '',
    'Rules:',
    '- One factual point per line, no bullet symbols, no numbering.',
    '- Plain, slightly informal technician English, not corporate-polished.',
    '- Do not invent equipment counts, model numbers, or details the notes do not imply.',
    '- If a line describes a fault, a defect, or something not working, start that line with "!" so it can be flagged.',
    '- Output only the lines. No heading, no preamble.'
  ].join('\n');
  try{
    const res = await SAMPLE(prompt, {modelTier: 'quick', cache: false});
    if(res && res.text && res.text.trim()) workEl.value = res.text.trim();
  }catch(e){
    const code = e && e.code;
    if(note) note.textContent = code === 'not_granted' ? 'Allow Claude on this page to use Rewrite.'
      : code === 'rate_limited' ? 'Too many rewrites. Wait a moment and try again.'
      : 'Could not rewrite just now. Your notes are unchanged.';
  }finally{
    btn.disabled = false;
    btn.innerHTML = label;
  }
}

function stamp(){ return new Date().toISOString().slice(0,10); }

async function saveFile(filename, data, mime){
  if(DOWNLOADS){
    try{ await DOWNLOADS.save({filename, data}); return true; }
    catch(e){
      if(!e || e.code !== 'declined') toast('Could not save the file in this view.');
      return false;
    }
  }
  const blob = data instanceof Blob ? data : new Blob([data], {type: mime || 'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  return true;
}

function openData(){ state.dataOpen = true; state.dataMsg = null; state.importPending = null; render(); }
function closeData(){ state.dataOpen = false; state.dataMsg = null; state.importPending = null; render(); }

async function exportBackup(){
  const payload = {
    app: 'conx-ops', version: 1, exportedAt: new Date().toISOString(),
    contracts: state.contracts, clients: state.clients, tickets: state.tickets, reports: state.reports
  };
  const ok = await saveFile(`conx-ops-backup-${stamp()}.json`, JSON.stringify(payload, null, 2), 'application/json');
  if(ok){ state.dataMsg = {kind:'ok', text:'Backup saved. Keep a copy somewhere safe, such as iCloud Drive.'}; render(); }
}

function csvCell(v){
  let s = v == null ? '' : String(v);
  if(/^[=+\-@]/.test(s) && !/^[+-]?[\d\s()-]+$/.test(s)) s = "'" + s; // stop spreadsheet formulas
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportCSV(kind){
  const rows = state[kind];
  if(!rows.length){ state.dataMsg = {kind:'err', text:`No ${kind} to export yet.`}; render(); return; }
  const cols = [];
  rows.forEach(r => Object.keys(r).forEach(k => { if(!cols.includes(k)) cols.push(k); }));
  const lines = [cols.join(',')].concat(rows.map(r => cols.map(c => csvCell(r[c])).join(',')));
  saveFile(`conx-ops-${kind}-${stamp()}.csv`, '﻿' + lines.join('\r\n'), 'text/csv');
}

function handleImportFile(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const d = JSON.parse(reader.result);
      if(!d || d.app !== 'conx-ops') throw new Error('notbackup');
      const pick = k => Array.isArray(d[k]) ? d[k] : [];
      state.importPending = {exportedAt: d.exportedAt, contracts: pick('contracts'), clients: pick('clients'), tickets: pick('tickets'), reports: pick('reports')};
      state.dataMsg = null;
    }catch(err){
      state.importPending = null;
      state.dataMsg = {kind:'err', text: err.message === 'notbackup' ? 'That file is not a Conx Ops backup.' : 'Could not read that file. Choose a .json backup made by Conx Ops.'};
    }
    render();
  };
  reader.readAsText(file);
}

async function runPool(jobs, size, onFail){
  let i = 0;
  const worker = async () => {
    while(i < jobs.length){
      const job = jobs[i++];
      try{ await job(); }catch(e){ onFail(e); }
    }
  };
  await Promise.all(Array.from({length: Math.min(size, jobs.length)}, worker));
}

async function applyImport(mode){
  const p = state.importPending;
  if(!p || state.saving) return;
  if(state.readOnly){
    state.dataMsg = {kind:'err', text:'You have view-only access, so you cannot import.'};
    render();
    return;
  }
  if(mode === 'replace' && !p.armed){ p.armed = true; render(); return; }
  state.saving = true;
  state.dataMsg = {kind:'ok', text:'Importing…'};
  render();
  const norm = list => list.filter(x => x && typeof x === 'object').map(x => ({...x, id: String(x.id || cid())}));
  const jobs = [];
  let failed = 0, total = 0;
  for(const kind of KINDS){
    const incoming = norm(p[kind]);
    if(kind === 'clients' && mode === 'merge'){
      const byName = new Map(state.clients.map(c => [(c.name || '').trim().toLowerCase(), c.id]));
      incoming.forEach(c => { const hit = byName.get((c.name || '').trim().toLowerCase()); if(hit) c.id = hit; });
    }
    if(mode === 'replace'){
      const keep = new Set(incoming.map(x => x.id));
      state[kind].filter(x => !keep.has(x.id)).forEach(x => jobs.push(() => removeRecord(kind, x.id)));
    }
    incoming.forEach(x => { total++; jobs.push(() => upsert(kind, x)); });
  }
  let lastErr = null;
  await runPool(jobs, 4, e => { failed++; lastErr = e; });
  state.saving = false;
  state.importPending = null;
  state.dataMsg = failed
    ? {kind:'err', text: `${failed} of ${jobs.length} changes did not save. ${writeError(lastErr)}`}
    : {kind:'ok', text: (mode === 'replace' ? 'Backup restored. ' : 'Backup merged. ') + `Now holding ${state.contracts.length} contracts, ${state.clients.length} clients, ${state.tickets.length} tickets, ${state.reports.length} reports.`};
  render();
}

          <button class="btn btn-primary" style="width:100%;" onclick="exportBackup()">Download full backup (.json)</button>
        </div>
        <div class="data-block">
          <div class="data-title">Export to Excel (.csv)</div>
          <div class="data-sub">One file per section.</div>
          <div class="data-row">
            <button class="btn btn-ghost" onclick="exportCSV('contracts')">AMC</button>
            <button class="btn btn-ghost" onclick="exportCSV('clients')">Clients</button>
            <button class="btn btn-ghost" onclick="exportCSV('tickets')">Tickets</button>
            <button class="btn btn-ghost" onclick="exportCSV('reports')">Reports</button>
          </div>
        </div>
        <div class="data-block">
          <div class="data-title">Monthly email backup</div>
          <div class="data-sub">A full backup (.json) and reports sheet (.csv) are emailed on the 1st of every month.</div>
          <input id="backupEmailInput" type="email" placeholder="you@example.com" value="${esc(state.backupEmail)}" style="width:100%; box-sizing:border-box; margin-bottom:10px;">
          <div class="data-row">
            <button class="btn btn-primary" onclick="saveBackupEmail()">Save email</button>
            <button class="btn btn-ghost" onclick="sendBackupNow()" ${state.backupBusy ? 'disabled' : ''}>Send a backup now</button>
          </div>
        </div>
        <div class="data-block">
          <div class="data-title">Import backup</div>
          ${importBlock}
        </div>
        <div class="modal-actions"><button type="button" class="btn btn-ghost" onclick="closeData()">Close</button></div>
      </div>
    </div>`;
}

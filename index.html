<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Conx Ops">
<meta name="theme-color" content="#14171C">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Conx Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
  :root{
    --bg:#0A0C12; --bg-glow:rgba(108,124,255,0.16);
    --surface:#141826; --surface-2:#1A1F31; --surface-3:#222840;
    --line:rgba(255,255,255,0.08); --line-strong:rgba(255,255,255,0.16);
    --text:#EEF0F7; --dim:#9AA2B8;
    --accent:#6C7CFF; --accent-2:#9B6BFF; --accent-ink:#fff;
    --grad:linear-gradient(135deg,#5667FF 0%,#8F5BFF 100%);
    --ok:#34D399; --warn:#FBBF24; --crit:#F87171;
    --shadow:0 10px 30px rgba(0,0,0,0.35);
    --r:18px;
    /* legacy names used by older markup */
    --panel:var(--surface); --panel-2:var(--surface-2); --text-dim:var(--dim);
    --indigo:#4B5BD8; --indigo-soft:var(--accent); --amber:var(--warn); --green:var(--ok); --red:var(--crit);
    color-scheme:dark;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#F3F5FB; --bg-glow:rgba(108,124,255,0.14);
      --surface:#FFFFFF; --surface-2:#F6F7FC; --surface-3:#ECEFF8;
      --line:rgba(20,26,60,0.09); --line-strong:rgba(20,26,60,0.18);
      --text:#12162B; --dim:#5E6684; --accent:#4F5FF0; --accent-2:#7C4DEB;
      --shadow:0 8px 26px rgba(40,50,110,0.10);
      color-scheme:light;
    }
  }
  :root[data-theme="light"]{
    --bg:#F3F5FB; --bg-glow:rgba(108,124,255,0.14);
    --surface:#FFFFFF; --surface-2:#F6F7FC; --surface-3:#ECEFF8;
    --line:rgba(20,26,60,0.09); --line-strong:rgba(20,26,60,0.18);
    --text:#12162B; --dim:#5E6684; --accent:#4F5FF0; --accent-2:#7C4DEB;
    --shadow:0 8px 26px rgba(40,50,110,0.10);
    color-scheme:light;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-size:15px; -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;}
  body::before{content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:radial-gradient(900px 500px at 85% -10%, var(--bg-glow), transparent 60%), radial-gradient(700px 420px at -5% 105%, rgba(155,107,255,0.10), transparent 60%);}
  #app{position:relative; z-index:1; height:100%;}
  button{font-family:inherit; cursor:pointer; color:inherit;}
  svg.ic{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0;}

  .shell{display:flex; height:100%;}
  .side{display:none;}
  .content{flex:1; min-width:0; display:flex; flex-direction:column; height:100%;}

  /* top bar */
  .topbar{display:flex; align-items:center; gap:12px; padding:calc(14px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) 10px max(16px, env(safe-area-inset-left,0px)); flex-shrink:0;}
  .topbar .ttl{flex:1; min-width:0;}
  .topbar h1{margin:0; font-family:'Barlow Semi Condensed','Inter',sans-serif; font-weight:700; font-size:26px; letter-spacing:0.2px; line-height:1.1;}
  .topbar .sub{font-size:12.5px; color:var(--dim); margin-top:3px;}
  .mbrand{display:flex; align-items:center; gap:9px;}
  .brandlogo{height:30px; width:auto; display:block; border-radius:8px; background:#fff; padding:3px;}
  .iconbtn{width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; color:var(--dim); transition:transform .15s, background .15s, color .15s;}
  .iconbtn:hover{color:var(--text); background:var(--surface-2);}
  .iconbtn:active{transform:scale(.94);}
  .newbtn{display:none; align-items:center; gap:8px; border:none; background:var(--grad); color:#fff; font-weight:600; font-size:14px; padding:11px 18px; border-radius:13px; box-shadow:0 8px 20px rgba(100,100,255,0.35); transition:transform .15s, box-shadow .15s;}
  .newbtn:hover{transform:translateY(-1px); box-shadow:0 12px 26px rgba(100,100,255,0.45);}
  .newbtn:active{transform:scale(.97);}

  main{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:6px max(16px, env(safe-area-inset-right,0px)) 120px max(16px, env(safe-area-inset-left,0px));}
  .page{max-width:1180px; margin:0 auto;}

  /* bottom nav (phones / portrait iPad) */
  nav.tabs{position:fixed; left:max(12px, env(safe-area-inset-left,0px)); right:max(12px, env(safe-area-inset-right,0px)); bottom:calc(10px + env(safe-area-inset-bottom,0px)); z-index:10;
    display:flex; gap:2px; padding:6px; border-radius:22px; background:color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--line-strong); box-shadow:var(--shadow);}
  nav.tabs button{flex:1; background:none; border:none; color:var(--dim); padding:8px 2px 7px; border-radius:16px; font-size:10.5px; font-weight:600; display:flex; flex-direction:column; align-items:center; gap:3px; transition:background .2s, color .2s, transform .15s;}
  nav.tabs button:active{transform:scale(.94);}
  nav.tabs button.active{color:#fff; background:var(--grad); box-shadow:0 6px 16px rgba(100,100,255,0.35);}

  .fab{position:fixed; z-index:9; right:max(18px, env(safe-area-inset-right,0px)); bottom:calc(92px + env(safe-area-inset-bottom,0px)); width:56px; height:56px; border-radius:18px; border:none; background:var(--grad); color:#fff; display:grid; place-items:center; box-shadow:0 12px 26px rgba(100,100,255,0.45); transition:transform .15s;}
  .fab:active{transform:scale(.92) rotate(90deg);}
  .fab svg{width:26px; height:26px; stroke-width:2.2;}

  /* sidebar (wide screens) */
  @media (min-width:900px){
    .side{display:flex; flex-direction:column; width:248px; flex-shrink:0; padding:calc(22px + env(safe-area-inset-top,0px)) 14px 18px max(14px, env(safe-area-inset-left,0px)); border-right:1px solid var(--line); background:color-mix(in srgb, var(--surface) 60%, transparent); backdrop-filter:blur(14px);}
    .side .brandrow{display:flex; align-items:center; gap:11px; padding:4px 8px 22px;}
    .side .brandrow .mark{font-family:'Barlow Semi Condensed',sans-serif; font-weight:700; font-size:21px; letter-spacing:.5px; line-height:1;}
    .side .brandrow .tag{font-size:10.5px; color:var(--dim); letter-spacing:1.4px; text-transform:uppercase; margin-top:3px;}
    .side nav button{width:100%; display:flex; align-items:center; gap:12px; border:none; background:none; color:var(--dim); padding:11px 12px; border-radius:13px; font-size:14.5px; font-weight:600; margin-bottom:3px; transition:background .2s, color .2s, transform .15s; text-align:left;}
    .side nav button:hover{background:var(--surface-2); color:var(--text);}
    .side nav button.active{background:var(--grad); color:#fff; box-shadow:0 8px 20px rgba(100,100,255,0.32);}
    .side nav button .cnt{margin-left:auto; font-size:11.5px; background:rgba(255,255,255,0.14); padding:2px 8px; border-radius:20px;}
    .side nav button:not(.active) .cnt{background:var(--surface-3); color:var(--dim);}
    .side .spacer{flex:1;}
    .side .sidefoot{display:flex; flex-direction:column; gap:6px; border-top:1px solid var(--line); padding-top:14px;}
    .side .sidefoot button{display:flex; align-items:center; gap:10px; background:none; border:none; color:var(--dim); padding:9px 12px; border-radius:11px; font-size:13.5px; font-weight:600; text-align:left;}
    .side .sidefoot button:hover{background:var(--surface-2); color:var(--text);}
    nav.tabs, .fab, .mbrand, .topbar .mactions{display:none !important;}
    .newbtn{display:flex;}
    .topbar{padding-top:calc(26px + env(safe-area-inset-top,0px)); padding-bottom:14px; padding-left:34px; padding-right:34px;}
    main{padding:4px 34px 50px;}
    .topbar h1{font-size:32px;}
  }

  /* cards & grids */
  .grid{display:grid; gap:14px; grid-template-columns:1fr;}
  @media (min-width:700px){ .grid.cols{grid-template-columns:repeat(2,1fr);} }
  @media (min-width:1280px){ .grid.cols{grid-template-columns:repeat(3,1fr);} }
  .card{position:relative; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;}
  .card:hover{transform:translateY(-2px); box-shadow:var(--shadow); border-color:var(--line-strong);}
  .card:active{transform:scale(.985);}
  .card .row1{display:flex; align-items:center; gap:12px;}
  .card .body{flex:1; min-width:0;}
  .card .title{font-weight:650; font-size:15.5px; line-height:1.3; overflow-wrap:anywhere;}
  .card .meta{font-size:12.5px; color:var(--dim); margin-top:3px; line-height:1.5; overflow-wrap:anywhere;}
  .avatar{width:44px; height:44px; border-radius:14px; display:grid; place-items:center; color:#fff; font-weight:700; font-size:15px; flex-shrink:0; letter-spacing:.5px;}
  .card .foot{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:13px;}
  .pill{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:20px; background:var(--surface-3); color:var(--dim); white-space:nowrap;}
  .pill.ok{background:rgba(52,211,153,.14); color:var(--ok);} .pill.warn{background:rgba(251,191,36,.15); color:var(--warn);} .pill.crit{background:rgba(248,113,113,.15); color:var(--crit);}
  .pill.accent{background:rgba(108,124,255,.16); color:var(--accent);}
  .badge{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; letter-spacing:.3px; white-space:nowrap; background:var(--surface-3); color:var(--dim);}
  .badge .dot{width:6px; height:6px; border-radius:50%; background:currentColor;}
  .badge.ok{background:rgba(52,211,153,.14); color:var(--ok);} .badge.warn{background:rgba(251,191,36,.15); color:var(--warn);} .badge.crit{background:rgba(248,113,113,.15); color:var(--crit);}
  .progress{height:6px; border-radius:6px; background:var(--surface-3); overflow:hidden; margin-top:13px;}
  .progress i{display:block; height:100%; border-radius:6px; background:var(--grad); width:0; transition:width .9s cubic-bezier(.2,.8,.2,1);}
  .progress.warn i{background:var(--warn);} .progress.crit i{background:var(--crit);}
  .mini-btn{background:var(--surface-3); border:1px solid var(--line); color:var(--text); padding:7px 12px; border-radius:10px; font-size:12.5px; font-weight:600; transition:background .15s, transform .15s;}
  .mini-btn:hover{background:var(--surface-2);} .mini-btn:active{transform:scale(.95);}
  .mini-btn.go{background:rgba(108,124,255,.16); border-color:transparent; color:var(--accent);}
  .mini-btn.good{background:rgba(52,211,153,.14); border-color:transparent; color:var(--ok);}

  /* toolbar: search + chips */
  .toolbar{display:flex; flex-direction:column; gap:12px; margin:6px 0 18px;}
  .search{position:relative;}
  .search svg{position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--dim); width:18px; height:18px;}
  .search input{width:100%; background:var(--surface); border:1px solid var(--line); color:var(--text); padding:13px 14px 13px 42px; border-radius:14px; font-size:15px; font-family:inherit; transition:border-color .15s, box-shadow .15s;}
  .search input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 4px rgba(108,124,255,.18);}
  .filter-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none;}
  .filter-row::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0; background:var(--surface); border:1px solid var(--line); color:var(--dim); padding:8px 14px; border-radius:20px; font-size:13px; font-weight:600; transition:all .15s;}
  .chip:hover{color:var(--text);}
  .chip .n{margin-left:6px; opacity:.7; font-weight:700;}
  .chip.active{background:var(--grad); border-color:transparent; color:#fff; box-shadow:0 6px 16px rgba(100,100,255,.3);}

  /* overview */
  .hero{margin:4px 0 20px;}
  .hero .hi{font-family:'Barlow Semi Condensed',sans-serif; font-weight:700; font-size:30px; line-height:1.1;}
  .hero .hi span{background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .hero p{margin:6px 0 0; color:var(--dim); font-size:14px;}
  .kpis{display:grid; gap:12px; grid-template-columns:repeat(2,1fr); margin-bottom:18px;}
  @media (min-width:900px){ .kpis{grid-template-columns:repeat(4,1fr); gap:14px;} }
  .kpi{position:relative; overflow:hidden; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; transition:transform .18s, box-shadow .18s, border-color .18s;}
  .kpi:hover{transform:translateY(-3px); box-shadow:var(--shadow); border-color:var(--line-strong);}
  .kpi:active{transform:scale(.97);}
  .kpi .ico{width:36px; height:36px; border-radius:11px; display:grid; place-items:center; background:rgba(108,124,255,.15); color:var(--accent); margin-bottom:12px;}
  .kpi.warn .ico{background:rgba(251,191,36,.15); color:var(--warn);} .kpi.crit .ico{background:rgba(248,113,113,.15); color:var(--crit);} .kpi.ok .ico{background:rgba(52,211,153,.14); color:var(--ok);}
  .kpi .n{font-family:'Barlow Semi Condensed',sans-serif; font-weight:700; font-size:34px; line-height:1;}
  .kpi .l{font-size:12.5px; color:var(--dim); margin-top:6px;}
  .quick{display:grid; gap:10px; grid-template-columns:repeat(3,1fr); margin-bottom:22px;}
  .quick button{display:flex; flex-direction:column; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 6px; font-size:12.5px; font-weight:600; transition:all .18s;}
  .quick button:hover{transform:translateY(-2px); border-color:var(--accent); box-shadow:var(--shadow);}
  .quick button:active{transform:scale(.96);}
  .quick .qi{width:40px; height:40px; border-radius:13px; display:grid; place-items:center; background:var(--grad); color:#fff;}
  .two{display:grid; gap:18px; grid-template-columns:1fr;}
  @media (min-width:1000px){ .two{grid-template-columns:1.25fr 1fr;} }
  .sec{display:flex; align-items:baseline; justify-content:space-between; margin:6px 0 12px;}
  .sec h2{margin:0; font-size:15px; font-weight:700; letter-spacing:.2px;}
  .sec a{font-size:12.5px; color:var(--accent); font-weight:600; background:none; border:none; padding:0;}
  .panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px;}
  .bars{display:flex; align-items:flex-end; gap:10px; height:130px; padding-top:8px;}
  .bars .b{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; height:100%;}
  .bars .b i{display:block; width:100%; max-width:38px; border-radius:9px 9px 4px 4px; background:var(--grad); height:0; transition:height .9s cubic-bezier(.2,.8,.2,1); min-height:4px;}
  .bars .b.zero i{background:var(--surface-3);}
  .bars .b span{font-size:11px; color:var(--dim);} .bars .b em{font-style:normal; font-size:11.5px; font-weight:700;}
  .row-item{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); cursor:pointer;}
  .row-item:last-child{border-bottom:none;}
  .row-item:hover .t{color:var(--accent);}
  .row-item .t{font-weight:600; font-size:14px; transition:color .15s;}
  .row-item .s{font-size:12px; color:var(--dim); margin-top:2px;}
  .row-item .grow{flex:1; min-width:0;}

  .empty{text-align:center; padding:56px 20px; color:var(--dim); grid-column:1/-1;}
  .empty .big{font-size:16px; color:var(--text); font-weight:650; margin-bottom:5px;}
  .empty .small{font-size:13.5px;}
  .empty .emoji{width:60px; height:60px; border-radius:20px; background:var(--surface-2); display:grid; place-items:center; margin:0 auto 14px; color:var(--accent);}
  .empty .emoji svg{width:28px; height:28px;}

  .anim .card, .anim .kpi, .anim .quick button, .anim .panel, .anim .hero{animation:rise .45s cubic-bezier(.2,.8,.2,1) both;}
  .anim .grid > :nth-child(2), .anim .kpis > :nth-child(2){animation-delay:.04s;} .anim .grid > :nth-child(3), .anim .kpis > :nth-child(3){animation-delay:.08s;}
  .anim .grid > :nth-child(4), .anim .kpis > :nth-child(4){animation-delay:.12s;} .anim .grid > :nth-child(5){animation-delay:.16s;} .anim .grid > :nth-child(6){animation-delay:.2s;}
  .anim .grid > :nth-child(n+7){animation-delay:.24s;}
  @keyframes rise{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;}}

  /* skeleton */
  .skel{border-radius:var(--r); background:linear-gradient(100deg,var(--surface) 30%,var(--surface-3) 50%,var(--surface) 70%); background-size:200% 100%; animation:shimmer 1.2s infinite linear; height:92px; border:1px solid var(--line);}
  @keyframes shimmer{from{background-position:200% 0;} to{background-position:-200% 0;}}
  .loading{text-align:center; padding:60px; color:var(--dim); font-size:13px;}

  /* sync chip */
  .sync{display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:600; color:var(--dim);}
  .sync i{width:8px; height:8px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 0 rgba(52,211,153,.6); animation:pulse 2s infinite;}
  .sync.warn i{background:var(--warn); animation:none;} .sync.neutral i{background:var(--dim); animation:none;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5);} 70%{box-shadow:0 0 0 8px rgba(52,211,153,0);} 100%{box-shadow:0 0 0 0 rgba(52,211,153,0);}}

  .banner{margin:0 max(16px, env(safe-area-inset-right,0px)) 8px max(16px, env(safe-area-inset-left,0px)); padding:10px 14px; border-radius:12px; background:rgba(251,191,36,.12); color:var(--warn); font-size:13px; line-height:1.45; border:1px solid rgba(251,191,36,.25);}

  /* modal / bottom sheet */
  .modal-backdrop{position:fixed; inset:0; background:rgba(5,7,12,.6); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); z-index:20; display:flex; align-items:flex-end; justify-content:center; animation:fade .2s ease-out;}
  @keyframes fade{from{opacity:0;} to{opacity:1;}}
  .modal{background:var(--surface-2); width:100%; max-width:640px; max-height:92vh; overflow-y:auto; border-radius:26px 26px 0 0; border:1px solid var(--line-strong); border-bottom:none;
    padding:10px max(20px, env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px, env(safe-area-inset-left,0px)); animation:sheet .32s cubic-bezier(.2,.9,.25,1.05);}
  @keyframes sheet{from{transform:translateY(60px) scale(.985); opacity:0;} to{transform:none; opacity:1;}}
  @media (min-width:700px){ .modal-backdrop{align-items:center;} .modal{border-radius:26px; border-bottom:1px solid var(--line-strong); max-height:88vh; padding-bottom:26px;} }
  .modal .grab{width:42px; height:5px; border-radius:5px; background:var(--line-strong); margin:4px auto 14px;}
  @media (min-width:700px){ .modal .grab{display:none;} .modal{padding-top:24px;} }
  .modal .mhead{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .modal h2{font-family:'Barlow Semi Condensed',sans-serif; font-size:23px; margin:0; font-weight:700;}
  .modal-error{background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.35); color:var(--crit); padding:11px 13px; border-radius:12px; font-size:13.5px; margin:0 0 14px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--dim); margin-bottom:6px; letter-spacing:.2px;}
  .field input, .field select, .field textarea{width:100%; background:var(--surface); border:1px solid var(--line); color:var(--text); padding:12px 14px; border-radius:13px; font-size:15px; font-family:inherit; transition:border-color .15s, box-shadow .15s;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 4px rgba(108,124,255,.18);}
  .field textarea{resize:vertical; min-height:74px; line-height:1.5;}
  .row2{display:flex; gap:12px;} .row2 .field{flex:1; min-width:0;}
  @media (max-width:420px){ .row2{flex-direction:column; gap:0;} }
  .modal-actions{display:flex; gap:10px; margin-top:20px; position:sticky; bottom:-1px; padding:12px 0 2px; background:var(--surface-2);}
  .btn{flex:1; padding:14px; border-radius:14px; border:none; font-size:15px; font-weight:650; transition:transform .15s, box-shadow .15s, opacity .15s;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--grad); color:#fff; box-shadow:0 8px 20px rgba(100,100,255,.32);}
  .btn-ghost{background:var(--surface); color:var(--text); border:1px solid var(--line);}
  .btn-danger{background:rgba(248,113,113,.14); color:var(--crit); flex:0 0 auto; padding-left:18px; padding-right:18px;}
  .btn:disabled{opacity:.6;}
  .ai-btn{display:inline-flex; align-items:center; gap:6px; background:rgba(108,124,255,.14); border:none; color:var(--accent); font-size:12px; font-weight:700; padding:5px 11px; border-radius:20px; transition:background .15s, transform .15s;}
  .ai-btn:hover{background:rgba(108,124,255,.24);} .ai-btn:active{transform:scale(.95);}
  .ai-btn:disabled{opacity:.6;}
  .ai-btn svg{width:14px; height:14px;}
  .ai-note{font-size:12.5px; color:var(--warn); margin-top:7px; line-height:1.45;} .ai-note:empty{display:none;}

  .data-block{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px;}
  .data-title{font-weight:700; font-size:14.5px; margin-bottom:3px;}
  .data-sub{font-size:12.5px; color:var(--dim); margin-bottom:12px; line-height:1.5;}
  .data-row{display:flex; gap:8px; flex-wrap:wrap;} .data-row .btn{flex:1 1 40%; padding:12px;}
  .file-btn{display:block; text-align:center; cursor:pointer;}
  .data-msg{padding:11px 13px; border-radius:12px; font-size:13.5px; margin:0 0 14px;}
  .data-msg.ok{background:rgba(52,211,153,.12); border:1px solid rgba(52,211,153,.35); color:var(--ok);}
  .data-msg.err{background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.35); color:var(--crit);}

  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(96px + env(safe-area-inset-bottom,0px)); max-width:min(92vw,420px); background:var(--surface-3); border:1px solid var(--line-strong); color:var(--text); padding:11px 16px; border-radius:14px; font-size:13.5px; font-weight:600; z-index:60; box-shadow:var(--shadow); animation:toastin .3s cubic-bezier(.2,.9,.25,1.05);}
  @keyframes toastin{from{opacity:0; transform:translate(-50%,14px) scale(.96);} to{opacity:1; transform:translate(-50%,0);}}
  @media (min-width:900px){ .toast{bottom:32px;} }

  /* sign-in */
  .login{height:100%; display:flex; align-items:center; justify-content:center; padding:24px;}
  .login form{width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line-strong); border-radius:26px; padding:30px 26px; box-shadow:var(--shadow); animation:rise .5s cubic-bezier(.2,.8,.2,1) both;}
  .login .lg{display:flex; align-items:center; gap:12px; margin-bottom:22px;}
  .login .lg .mark{font-family:'Barlow Semi Condensed',sans-serif; font-weight:700; font-size:28px; line-height:1;}
  .login .lg .tag{font-size:12px; color:var(--dim); margin-top:3px;}
  .login input{width:100%;}

  /* report viewer */
  .report-overlay{position:fixed; inset:0; background:var(--bg); z-index:30; display:flex; flex-direction:column; animation:fade .2s ease-out;}
  .report-toolbar{display:flex; gap:10px; padding:calc(12px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) 12px max(16px, env(safe-area-inset-left,0px)); border-bottom:1px solid var(--line); flex-shrink:0; align-items:center; background:color-mix(in srgb, var(--surface) 80%, transparent); backdrop-filter:blur(14px);}
  .report-toolbar .close-btn{background:var(--surface); border:1px solid var(--line); color:var(--text); width:40px; height:40px; border-radius:12px; font-size:20px; line-height:1;}
  .report-toolbar .spacer{flex:1;}
  .report-toolbar button.act{background:var(--surface); border:1px solid var(--line); color:var(--text); padding:10px 15px; border-radius:12px; font-size:13.5px; font-weight:650; transition:transform .15s;}
  .report-toolbar button.act:active{transform:scale(.95);}
  .report-toolbar button.act.primary{background:var(--grad); border-color:transparent; color:#fff; box-shadow:0 6px 16px rgba(100,100,255,.3);}
  .report-toolbar button.act:disabled{opacity:.6;}
  .report-scroll{flex:1; overflow:auto; -webkit-overflow-scrolling:touch; padding:22px max(12px, env(safe-area-inset-right,0px)) 60px max(12px, env(safe-area-inset-left,0px)); background:color-mix(in srgb, var(--bg) 70%, #000);}
  /* the report is always a true A4 sheet (210 x 297 mm = 794 x 1123 px), scaled to fit the screen */
  .sheet-wrap{margin:0 auto; position:relative;}
  .report-doc{background:#fff; color:#1a1a1a; width:794px; min-height:1123px; box-sizing:border-box; padding:40px; transform-origin:top left; box-shadow:0 10px 40px rgba(0,0,0,.45); border-radius:3px; font-family:'Inter',-apple-system,sans-serif;}

  @page{size:A4; margin:0;}
  @media print{
    html,body{height:auto !important; overflow:visible !important; background:#fff !important;}
    body::before{display:none !important;}
    #app{display:block !important; height:auto !important;}
    #app > *:not(.report-overlay){display:none !important;}
    .report-overlay{position:static !important; display:block !important; background:#fff !important; animation:none !important;}
    .report-toolbar{display:none !important;}
    .report-scroll{padding:0 !important; overflow:visible !important; background:#fff !important;}
    .sheet-wrap{width:210mm !important; height:auto !important; margin:0 !important;}
    .report-doc{transform:none !important; box-shadow:none !important; border-radius:0 !important; width:210mm !important; min-height:1122px !important; padding:40px !important;}
    .toast{display:none !important;}
  }
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

  .detail-overlay{position:fixed; inset:0; background:var(--bg); z-index:15; display:flex; flex-direction:column; animation:fade .2s ease-out;}
  .detail-overlay .report-toolbar{position:relative;}
  .detail-scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:18px max(16px, env(safe-area-inset-right,0px)) 80px max(16px, env(safe-area-inset-left,0px));}
  @media (min-width:900px){ .detail-scroll{padding:24px 34px 60px;} }
  .dhead{display:flex; align-items:center; gap:14px; margin-bottom:16px;}
  .dhead .avatar{width:58px; height:58px; font-size:19px; border-radius:18px;}
  .dhead h1{margin:0; font-family:'Barlow Semi Condensed','Inter',sans-serif; font-size:30px; font-weight:700; line-height:1.1;}
  .grow{flex:1; min-width:0;}
  .s{font-size:12.5px; color:var(--dim); line-height:1.5; overflow-wrap:anywhere;}
  .t{font-weight:650; font-size:14.5px; overflow-wrap:anywhere;}
  .dstats{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:18px;}
  .dstat{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:12px 14px;}
  .dstat b{display:block; font-family:'Barlow Semi Condensed',sans-serif; font-size:26px; line-height:1;}
  .dstat span{font-size:11.5px; color:var(--dim);}
  .dstat.warn b{color:var(--warn);}
  @media (max-width:520px){ .dstats{grid-template-columns:repeat(2,1fr);} }
  .dgrid{display:grid; gap:18px; grid-template-columns:1fr; align-items:start;}
  @media (min-width:1000px){ .dgrid{grid-template-columns:1.15fr 1fr;} }
  .dcol{display:flex; flex-direction:column; gap:18px; min-width:0;}
  .panel .sec h2{display:flex; align-items:center; gap:8px;}
  .panel .sec h2 svg{width:18px; height:18px; color:var(--accent);}
  .vrow{padding:12px 0; border-bottom:1px solid var(--line);} .vrow:last-child{border-bottom:none;}
  .vtop{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
  .vdots, .visits .vdots{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}
  .vd{min-width:34px; height:28px; padding:0 8px; border-radius:9px; display:grid; place-items:center; font-size:11.5px; font-weight:700; background:var(--surface-3); color:var(--dim);}
  .vd.done{background:rgba(52,211,153,.16); color:var(--ok);} .vd.due{background:rgba(251,191,36,.18); color:var(--warn);}
  .vd.overdue{background:rgba(248,113,113,.18); color:var(--crit);} .vd.soon{background:rgba(108,124,255,.18); color:var(--accent);}
  .visits{margin-top:12px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;} .visits .vdots{margin-top:0;}
  .siteblk{padding:12px 0; border-bottom:1px solid var(--line);} .siteblk:last-child{border-bottom:none;}
  .sitehead{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px;}
  .chips2{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
  .arow{display:flex; align-items:center; gap:10px; padding:9px 10px; margin:0 -10px; border-radius:12px; cursor:pointer; transition:background .15s;}
  .arow:hover{background:var(--surface-2);}
  .nrow{padding:12px 0; border-bottom:1px solid var(--line);} .nrow:last-child{border-bottom:none;}
  .ntop{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:6px;}
  .kv{display:flex; align-items:center; gap:8px; margin-top:6px;}
  .kv span{width:70px; flex-shrink:0; font-size:12px; color:var(--dim);}
  .kv code{flex:1; min-width:0; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; background:var(--surface-2); padding:6px 10px; border-radius:9px; overflow-wrap:anywhere;}
  .iconbtn.sm{width:32px; height:32px; border-radius:10px;} .iconbtn.sm svg{width:16px; height:16px;}
  .qtext{width:100%; min-height:260px; background:var(--surface-2); border:1px solid var(--line); color:var(--text); border-radius:13px; padding:12px 14px; font-family:inherit; font-size:13px; line-height:1.55; resize:vertical;}
  .trow{display:flex; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); cursor:pointer;} .trow:last-child{border-bottom:none;}
  .tdot{width:10px; height:10px; border-radius:50%; background:var(--ok); margin-top:5px; flex-shrink:0; box-shadow:0 0 0 4px rgba(52,211,153,.15);}
  .tdot.bad{background:var(--crit); box-shadow:0 0 0 4px rgba(248,113,113,.15);}
  .issue{display:flex; gap:7px; align-items:flex-start; margin-top:6px; padding:6px 10px; border-radius:10px; background:rgba(248,113,113,.1); color:var(--crit); font-size:12.5px;}
  .issue svg{width:15px; height:15px; margin-top:1px;}
  .report-toolbar button.act.primary{white-space:nowrap;}
  .mini-btn svg{width:14px; height:14px; vertical-align:-2px; margin-right:3px;}
.client-hint{font-size:12px;margin-top:5px;min-height:0}.client-hint:empty{display:none}.client-hint.ok{color:var(--ok)}.client-hint.warn{color:var(--warn)}

const CONTRACT_STATUS = c => {
  const days = Math.ceil((new Date(c.endDate) - new Date()) / 86400000);
  if(days < 0) return {status:'expired', label:'Expired', cls:'crit', days};
  if(days <= 30) return {status:'due', label:`${days}d left`, cls:'warn', days};
  return {status:'active', label:'Active', cls:'ok', days};
};

const KINDS = ['contracts', 'clients', 'tickets', 'reports', 'assets', 'notes'];

function toast(text){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4500);
}

// Live updates must never wipe a form someone is filling in
function softRender(){
  if(state.modal || state.dataOpen || state.reportView) return;
  render();
}

// A copy of the data is kept on this device. Updating the app (index.html) never touches it or the database,
// so counts and records are identical before and after an update, and still show when offline.
const APP_VERSION = 'V1';
const CACHE_KEY = 'conx-ops-data';
let _cacheT = null;
function saveCache(){
  clearTimeout(_cacheT);
  _cacheT = setTimeout(() => { try{ const o = {v: APP_VERSION, at: Date.now()}; KINDS.forEach(k => o[k] = state[k]); localStorage.setItem(CACHE_KEY, JSON.stringify(o)); }catch(e){} }, 300);
}
function readCache(){ try{ const o = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); return (o && KINDS.every(k => Array.isArray(o[k]))) ? o : null; }catch(e){ return null; } }
function clearCache(){ try{ localStorage.removeItem(CACHE_KEY); }catch(e){} }

function applyChange(kind, id, row){
  if(!KINDS.includes(kind)) return;
  state[kind] = row
    ? (state[kind].some(x => x.id === id) ? state[kind].map(x => x.id === id ? row : x) : [...state[kind], row])
    : state[kind].filter(x => x.id !== id);
  saveCache();
}

async function loadAllRows(){
  const rows = [];
  for(let from = 0; ; from += 1000){
    const {data, error} = await SB.from('records').select('kind,id,data').range(from, from + 999);
    if(error) throw error;
    rows.push(...data);
    if(data.length < 1000) break;
  }
  // Safety: never replace saved data with an empty answer (e.g. a wrong project or a database hiccup)
  const cached = readCache();
  if(!rows.length && cached && KINDS.some(k => cached[k].length)) throw new Error('The database returned no records');
  KINDS.forEach(k => state[k] = []);
  rows.forEach(r => { if(KINDS.includes(r.kind)) state[r.kind].push({...r.data, id: r.id}); });
  saveCache();
}

let channel = null;
function startRealtime(){
  if(channel) SB.removeChannel(channel);
  channel = SB.channel('records-live')
    .on('postgres_changes', {event: '*', schema: 'public', table: 'records'}, p => {
      if(p.eventType === 'DELETE'){ const o = p.old || {}; if(o.kind && o.id) applyChange(o.kind, o.id, null); }
      else { const n = p.new; applyChange(n.kind, n.id, {...n.data, id: n.id}); }
      softRender();
    })
    .subscribe(status => {
      if(status === 'SUBSCRIBED'){ state.syncError = null; loadAllRows().then(softRender).catch(() => {}); }
      else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT'){ state.syncError = 'offline'; softRender(); }
    });
}

async function upsert(kind, obj){
  const before = state[kind];
  state[kind] = before.some(x => x.id === obj.id)
    ? before.map(x => x.id === obj.id ? obj : x)
    : [...before, obj];
  const {error} = await SB.from('records').upsert({kind, id: obj.id, data: obj, updated_at: new Date().toISOString()}, {onConflict: 'kind,id'});
  if(error){ state[kind] = before; throw error; }   // a failed save must not look saved
  saveCache();
}
async function removeRecord(kind, id){
  const before = state[kind];
  state[kind] = before.filter(x => x.id !== id);
  const {error} = await SB.from('records').delete().eq('kind', kind).eq('id', id);
  if(error){ state[kind] = before; throw error; }
  saveCache();
}

async function submitModal(e){
  e.preventDefault();
  if(state.saving) return;
  const form = e.target;
  const fd = new FormData(form);
  const obj = {};
  fd.forEach((v,k) => obj[k] = (k === 'password' || typeof v !== 'string') ? v : v.trim());
  const {type, isNew} = state.modal;

  const reqs = REQUIRED_FIELDS[type] || [];
  const missing = reqs.filter(([key]) => !(obj[key] || '').trim()).map(([,label]) => label);
  if(missing.length){
    state.modal.data = {...state.modal.data, ...obj};   // keep what was typed
    state.modal.error = `Please fill in: ${missing.join(', ')}`;
    render();
    return;
  }

  obj.id = state.modal.data.id || cid();
  state.saving = true;
  try{
    if(type === 'reportForm'){
      obj.createdAt = new Date().toISOString();
      if(String(obj.serialNo) === state.modal.suggestedSerial) obj.serialNo = String(await claimSerial());
    }
    // Renaming a client: move its contracts, tickets, reports, assets and notes along with it
    const old = (type === 'client' && !isNew) ? state.clients.find(c => c.id === obj.id) : null;
    await upsert(KIND_OF[type], obj);
    if(old && old.name && old.name !== obj.name){
      for(const k of ['contracts','tickets','reports','assets','notes'])
        for(const r of state[k].filter(x => lc(x.client) === lc(old.name))) await upsert(k, {...r, client: obj.name});
    }
  }catch(err){
    state.saving = false;
    state.modal.data = {...state.modal.data, ...obj};
    state.modal.error = writeError(err);
    render();
    return;
  }
  state.saving = false;
  if(type === 'reportForm'){
    state.modal = null;
    state.reportView = obj;
    render();
    return;
  }
  closeModal();
  toast('Saved ✓');
}

const ASSET_TYPES = ['CCTV Camera','NVR / DVR','Access Controller','Door Reader / Lock','Biometric Device','Fire Alarm Panel','Smoke / Heat Detector','Manual Call Point','Fire Extinguisher','FM200 System','PA Amplifier','PA Speaker','Boom Barrier','BMS Controller','Network Switch','UPS','Other'];
const ASSET_STATUS = ['Working','Faulty','Under repair','Removed'];
const ASSET_STATUS_CLS = {Working:'ok', Faulty:'crit', 'Under repair':'warn', Removed:''};
const FREQ = {'Monthly':1, 'Quarterly':3, 'Half-yearly':6, 'Yearly':12};
const lc = x => String(x||'').trim().toLowerCase();

function addMonths(d, n){ const x = new Date(d); const day = x.getDate(); x.setMonth(x.getMonth() + n); if(x.getDate() !== day) x.setDate(0); return x; }
function contractReports(c){
  return state.reports.filter(r => lc(r.client) === lc(c.client) && r.natureOfCall !== 'Complaint' && (!c.site || !r.site || lc(r.site) === lc(c.site)));
}
// The visit schedule of an AMC (quarterly by default) and which visits already have a report
function visitPlan(c){
  const step = FREQ[c.visitFrequency || 'Quarterly'] || 3;
  const s0 = new Date(c.startDate), e0 = new Date(c.endDate);
  if(isNaN(s0) || isNaN(e0) || !(s0 < e0)) return [];
  const months = (e0.getFullYear() - s0.getFullYear()) * 12 + e0.getMonth() - s0.getMonth();
  const n = Math.max(1, Math.round(months / step));
  const reps = contractReports(c);
  const today = new Date(); today.setHours(0,0,0,0);
  const pre = step === 3 ? 'Q' : step === 1 ? 'M' : step === 6 ? 'H' : 'Y';
  const out = [];
  for(let i = 0; i < n; i++){
    const start = addMonths(s0, i * step), end = addMonths(s0, (i + 1) * step);
    const from = new Date(start); from.setDate(from.getDate() - 15);
    const hit = reps.find(r => { const d = new Date(r.serviceDate || r.createdAt); return d >= from && d < end; });
    let status;
    if(hit) status = 'done'; else if(end <= today) status = 'overdue'; else if(start <= today) status = 'due'; else if(start - today <= 30 * 864e5) status = 'soon'; else status = 'future';
    out.push({n: i + 1, label: pre + (i + 1), start, end, status, report: hit || null});
  }
  return out;
}
function nextVisit(c){
  if(CONTRACT_STATUS(c).status === 'expired') return null;
  return visitPlan(c).find(v => v.status === 'overdue' || v.status === 'due' || v.status === 'soon') || null;
}
const VISIT_TXT = {overdue:'Overdue', due:'Due now', soon:'Coming up', done:'Done', future:'Later'};
const VISIT_CLS = {overdue:'crit', due:'warn', soon:'accent', done:'ok', future:''};
function visitsToDo(){
  const order = {overdue:0, due:1, soon:2};
  return state.contracts.map(c => ({c, v: nextVisit(c)})).filter(x => x.v).sort((a,b) => order[a.v.status] - order[b.v.status] || a.v.start - b.v.start);
}
function sitesOf(clientName){
  const set = new Map();
  const add = x => { const t = String(x||'').trim(); if(t && !set.has(t.toLowerCase())) set.set(t.toLowerCase(), t); };
  const cl = state.clients.find(c => lc(c.name) === lc(clientName));
  if(cl && cl.sites) String(cl.sites).split(/\n|;/).forEach(add);
  [state.contracts, state.assets, state.notes, state.reports, state.tickets].forEach(list => list.forEach(x => { if(lc(x.client) === lc(clientName)) add(x.site); }));
  return [...set.values()];
}
function findClient(name){ const n = lc(name); return n ? state.clients.find(c => lc(c.name) === n) || null : null; }
function clientAddr(cl){ return cl ? String(cl.address || cl.sites || '').trim() : ''; }
// Fill the contact/address fields of an open form from the chosen client.
// Only overwrites a field if it is empty or still holds what we filled last time (so manual edits are kept).
function onClientInput(el){
  const form = el.form; if(!form) return;
  const cl = findClient(el.value);
  const setAuto = (name, val) => {
    const f = form.elements[name]; if(!f) return;
    if(f.value === '' || f.value === (f.dataset.auto || '')){ f.value = val || ''; f.dataset.auto = val || ''; }
  };
  setAuto('clientAddress', clientAddr(cl));
  setAuto('contactName', cl ? cl.contactPerson : '');
  setAuto('contactDepartment', cl ? cl.department : '');
  setAuto('contactNumber', cl ? cl.phone : '');
  const siteEl = form.elements['site'];
  const sites = el.value.trim() ? sitesOf(el.value) : allSites();
  if(siteEl && siteEl.list) siteEl.list.innerHTML = sites.map(x => `<option value="${esc(x)}">`).join('');
  if(siteEl && cl && sites.length === 1 && (siteEl.value === '' || siteEl.value === (siteEl.dataset.auto || ''))){ siteEl.value = sites[0]; siteEl.dataset.auto = sites[0]; }
  const hint = form.querySelector('.client-hint');
  if(hint){
    const v = el.value.trim();
    hint.textContent = !v ? '' : cl ? '✓ Details filled from the client record' : 'Not in your Clients list — add it under Clients to fill details automatically';
    hint.className = 'client-hint ' + (cl ? 'ok' : 'warn');
  }
  onSiteInput(siteEl);
}
// When client + site match an AMC contract, pre-select its system type (report form only).
function onSiteInput(el){
  const form = el && el.form; if(!form) return;
  const sys = form.elements['systemAttended']; const cEl = form.elements['client'];
  if(!sys || !cEl || form.dataset.sysTouched) return;
  const m = state.contracts.find(c => lc(c.client) === lc(cEl.value) && el.value.trim() && lc(c.site) === lc(el.value));
  if(m && SYSTEM_TYPES.includes(m.systemType) && sys.value !== m.systemType){ sys.value = m.systemType; autofillPmsDesc(m.systemType); }
}
function allSites(){ const set = new Set(); [state.contracts, state.assets, state.notes].forEach(l => l.forEach(x => { if(x.site) set.add(x.site); })); return [...set]; }
function issuesOf(r){ return String(r.workCarriedOut||'').split('\n').map(l => l.trim()).filter(l => l.startsWith('!')).map(l => l.replace(/^!\s*/, '')); }
function assetQty(a){ return Math.max(1, parseInt(a.qty, 10) || 1); }
function assetSummary(list){
  const m = new Map();
  list.filter(a => a.status !== 'Removed').forEach(a => m.set(a.assetType || 'Other', (m.get(a.assetType || 'Other') || 0) + assetQty(a)));
  return [...m.entries()].sort((a,b) => b[1] - a[1]);
}
function quarterRange(which){
  const now = new Date(); let q = Math.floor(now.getMonth() / 3), y = now.getFullYear();
  if(which === 'prev'){ q -= 1; if(q < 0){ q = 3; y -= 1; } }
  const start = new Date(y, q * 3, 1), end = new Date(y, q * 3 + 3, 1);
  const fm = d => d.toLocaleDateString('en-IN', {month:'short'});
  return {start, end, label: `${fm(start)} – ${fm(new Date(y, q * 3 + 2, 1))} ${y}`};
}
function quarterSummary(clientName, which){
  const {start, end, label} = quarterRange(which);
  const reps = state.reports.filter(r => lc(r.client) === lc(clientName) && (() => { const d = new Date(r.serviceDate || r.createdAt); return d >= start && d < end; })())
    .sort((a,b) => new Date(a.serviceDate) - new Date(b.serviceDate));
  const fd = d => new Date(d).toLocaleDateString('en-IN', {day:'numeric', month:'short'});
  const L = [`Quarterly service update: ${clientName}`, `Period: ${label}`, ''];
  if(!reps.length){ L.push('No service visits were recorded in this period.'); }
  else {
    const pm = reps.filter(r => r.natureOfCall !== 'Complaint').length;
    L.push(`Visits: ${reps.length} (preventive maintenance ${pm}, complaints ${reps.length - pm})`);
    L.push(`Systems serviced: ${[...new Set(reps.map(r => r.systemAttended).filter(Boolean))].join(', ') || 'n/a'}`);
    L.push('', 'What was done:');
    reps.forEach(r => {

  const nv = state.contracts.filter(c => lc(c.client) === lc(clientName)).map(nextVisit).filter(Boolean).sort((a,b) => a.start - b.start)[0];

}

function runVisuals(){

  if(state._count){
    state._count = false;
    document.querySelectorAll('[data-count]').forEach(el => {
      const target = Number(el.getAttribute('data-count')) || 0; const t0 = performance.now(); const dur = 700;
      const step = now => { const p = Math.min(1, (now - t0) / dur); el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3))); if(p < 1) requestAnimationFrame(step); };

  }
}

  if(!plan.length) return '';
  const nv = nextVisit(c);
  const nvTxt = nv ? `<span class="pill ${VISIT_CLS[nv.status]}">${nv.label} visit · ${nv.status==='overdue' ? 'overdue' : nv.status==='due' ? 'due now' : 'from ' + fmtDate(nv.start)}</span>` : (plan.every(v => v.status === 'done') ? '<span class="pill ok">All visits done</span>' : '');
  return `<div class="visits"><div class="vdots">${plan.map(v => `<span class="vd ${v.status}" title="${v.label}: ${VISIT_TXT[v.status]}">${v.status==='done' ? '✓' : v.label}</span>`).join('')}</div>${nvTxt}</div>`;
}

// Stretch the report so it fills one A4 page: the empty space is added to the "work carried out" box.
const A4_INNER_H = 1123 - 80 - 4;   // page height minus 40px padding top and bottom, minus a small safety margin
function fillPage(root){
  const t = root && root.querySelector('table'); const f = root && root.querySelector('tr.fill td');
  if(!t || !f) return;
  f.style.height = '0px';
  f.style.height = Math.max(0, A4_INNER_H - t.offsetHeight) + 'px';
}
function fitSheet(){
  fillPage(document.getElementById('reportDocEl'));
  const wrap = document.getElementById('sheetWrap');
  const doc = document.getElementById('reportDocEl');
  const scroller = wrap && wrap.parentElement;
  if(!wrap || !doc || !scroller) return;
  const cs = getComputedStyle(scroller);
  const avail = scroller.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const k = Math.min(1, avail / 794);
  doc.style.transform = `scale(${k})`;
  wrap.style.width = Math.round(794 * k) + 'px';
  wrap.style.height = Math.round(doc.offsetHeight * k) + 'px';
}
window.addEventListener('resize', () => { if(state.reportView) fitSheet(); });

function printReport(){
  // Opens the device's print sheet: AirPrint on iPad/iPhone, the system print dialog on a computer.
  fitSheet();
  window.print();
}

function loadScript(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = () => reject(new Error('load failed'));
    document.head.appendChild(s);
  });
}
async function ensurePdfLibs(){
  if(!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  if(!(window.jspdf && window.jspdf.jsPDF)) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
}

async function downloadReportPDF(){
  const r = state.reportView;
  if(!r) return;
  const btn = document.getElementById('pdfBtn');
  const label = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Making PDF…'; }
  let host = null;
  try{
    await ensurePdfLibs();
    // Render a true A4 sheet (794 x 1123 px) so the PDF is identical on every device
    host = document.createElement('div');
    host.style.cssText = 'position:absolute; left:-10000px; top:0; width:794px; min-height:1123px; box-sizing:border-box; padding:40px; background:#fff;';
    host.innerHTML = reportTableHTML(r);
    document.body.appendChild(host);
    await new Promise(r => setTimeout(r, 120));
    fillPage(host);
    const canvas = await window.html2canvas(host, {scale: 3, backgroundColor: '#ffffff', useCORS: true, logging: false});
    const pdf = new window.jspdf.jsPDF({unit: 'mm', format: 'a4', compress: true});
    const pageW = 210, pageH = 297;
    const imgH = canvas.height * pageW / canvas.width;
    const img = canvas.toDataURL('image/png');
    const pages = Math.max(1, Math.ceil(imgH / pageH - 0.001));
    for(let i = 0; i < pages; i++){
      if(i > 0) pdf.addPage();
      pdf.addImage(img, 'PNG', 0, -i * pageH, pageW, imgH);
    }
    const safeClient = (r.client || 'Client').replace(/[^a-z0-9]+/gi, '_').replace(/^_|_$/g, '');
    await saveFile(`SR-${r.serialNo || 'draft'}_${safeClient}.pdf`, pdf.output('blob'), 'application/pdf');
  }catch(e){
    toast('Could not make the PDF. Check your connection and try again.');
  }finally{
    if(host) host.remove();
    if(btn){ btn.disabled = false; btn.textContent = label; }
  }
}

const PM_TOPICS = [[/camera|cam\b|dome|lens/i,'cameras'],[/nvr|dvr|recording|playback/i,'recording'],[/hdd|hard ?disk|storage/i,'HDD'],[/network|switch|router|poe|lan\b/i,'network'],[/ups|battery|power|smps|psu/i,'power supply'],[/panel/i,'panel'],[/detector|smoke|heat/i,'detectors'],[/sounder|hooter|strobe|speaker|amplifier/i,'sounders and speakers'],[/mcp|call point/i,'call points'],[/cylinder|gauge|pressure/i,'pressure gauges'],[/reader|card|biometric|finger|face/i,'readers'],[/controller/i,'controllers'],[/lock|door|exit/i,'door locks'],[/boom|barrier|loop|motor/i,'boom and sensors'],[/valve|compressor|pneumatic/i,'pneumatic parts'],[/sensor/i,'sensors'],[/software|server|log/i,'software']];

// Offline writer: turns rough notes into proper service-report lines (no server or key needed)
function localRewrite(text, system){
  const FAULT = /\b(not working|not responding|faulty|fail(ed|ure|ing)?|damaged|broken|defective|error|offline|no signal|no display|no power|dead|loose|burnt|burned|needs? (replacement|repair|attention)|issue|problem|noisy|overheat\w*|down|missing|stolen|blur\w*|hang\w*|stuck)\b/i;
  const OK = /\b(no (issue|problem|fault|error)s?|without (any )?(issue|problem)s?|all (are )?(ok|okay|fine|good|working)|working (normal|fine|ok)|found (normal|ok|good))\b/i;
  const VERBS = {checked:'checked',check:'checked',cleaned:'cleaned',clean:'cleaned',tested:'tested',test:'tested',verified:'verified',updated:'updated',update:'updated',replaced:'replaced',replace:'replaced',configured:'configured',inspected:'inspected',observed:'observed',tightened:'tightened',aligned:'aligned',adjusted:'adjusted',reset:'reset',rebooted:'rebooted',restarted:'restarted',lubricated:'lubricated',greased:'greased',calibrated:'calibrated',serviced:'serviced',measured:'measured',changed:'changed',fixed:'fixed',repaired:'repaired',rectified:'rectified',backed:'backed',synced:'synced',tuned:'tuned'};
  const NOUN = /^(cameras?|nvr|dvr|hdd|panel|detectors?|sounders?|hooters?|speakers?|amplifier|mixer|readers?|controllers?|locks?|sensors?|battery|batteries|ups|network|switch|router|cables?|cabling|wiring|power supply|extinguishers?|cylinders?|gauges?|valves?|compressor|filters?|software|server|recorder|monitor|domes?|lenses|lens|barrier|loop|motor|device|devices|system|connections?|doors?)\b/i;
  const ABBR = [[/\bcams\b/gi,'cameras'],[/\bcam\b/gi,'camera'],[/\bnvr\b/gi,'NVR'],[/\bdvr\b/gi,'DVR'],[/\bhdd\b/gi,'HDD'],[/\bups\b/gi,'UPS'],[/\bsmps\b/gi,'SMPS'],[/\bpsu\b/gi,'PSU'],[/\bmcp\b/gi,'MCP'],[/\bn\/?w\b/gi,'network'],[/\bpoe\b/gi,'PoE'],[/\bip\b/gi,'IP'],[/\bbio\b/gi,'biometric'],[/\bpls\b/gi,'please'],[/\bw\/o\b/gi,'without'],[/\bdoin\b/gi,'doing']];
  const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
  const parts = String(text).replace(/\r/g,'').split(/\n+|;\s*|\.\s+(?=[A-Za-z0-9])|,\s+(?!and\b|but\b|found\b|which\b|to be\b|so\b)|\s+&\s+/).map(x => x.trim()).filter(Boolean);
  const out = [], seen = new Set();
  const push = line => { const k = line.toLowerCase(); if(!seen.has(k)){ seen.add(k); out.push(line); } };
  parts.forEach(raw => {
    let flagged = raw.startsWith('!');
    let p = raw.replace(/^[!\-*•\s]+/, '').replace(/^\d+[.)]\s+/, '').replace(/\s+/g,' ').replace(/[.,]+$/,'').trim();
    if(!p) return;
    ABBR.forEach(([re, v]) => { p = p.replace(re, v); });
    p = p.replace(/\bcameras\b/g, 'cameras');
    const words = p.split(' ');
    const v0 = VERBS[words[0].toLowerCase()];
    const faulty = FAULT.test(p) && !OK.test(p);
    let line;
    if(v0){
      let rest = words.slice(1).join(' ');
      if(rest && NOUN.test(rest) && !/^(the|all|a|an|each|every|\d)/i.test(rest)) rest = 'the ' + rest;
      line = 'We have ' + v0 + (rest ? ' ' + rest : '');
      if(!faulty && /\s(?:all\s)?(ok|okay|fine)$/i.test(line)) line = line.replace(/,?\s(?:all\s)?(ok|okay|fine)$/i, ', found working normal');
      else if(!faulty && !/(found|working|normal|good|condition|ok|fine|range|clean)/i.test(rest) && ['checked','tested','verified','inspected','observed'].includes(v0)) line += ', found working normal';
    } else {
      line = p;
      let m;
      if(!faulty && (m = line.match(/^(.*?)\s+(?:is |are |was |were )?(ok|okay|fine|working|normal|working fine|working ok)$/i)) && m[1]){
        line = cap(m[1]) + (/^all\b|s$/i.test(m[1]) ? ' are' : ' is') + ' working normal';
      } else if((m = line.match(/^(.*?)\s+(?:is |are )?good$/i)) && m[1]){
        line = cap(m[1]) + (/^all\b|s$/i.test(m[1]) ? ' are' : ' is') + ' in good condition';
      } else if(faulty && !/found/i.test(line)){
        line = line.replace(/\b(not working|not responding|faulty|damaged|broken|defective|offline|dead|loose|burnt|burned|missing|stuck)\b/i, 'found $1');
        if(!/found/i.test(line)) line = line + ' found';
      }
    }
    if(faulty && !/to be|please|needs?/i.test(line)) line += ', to be rectified';
    line = cap(line);
    push((flagged || faulty ? '! ' : '') + line);
  });
  // very short notes: fill in the standard PM points for this system
  const total = String(text).trim().split(/\s+/).length;
  let added = 0;
  if(total <= 14 || out.length <= 2){
    const have = out.join(' ').toLowerCase();
    (PM_CHECKLIST[system] || []).forEach(item => {
      const keys = item.toLowerCase().split(/\W+/).filter(w => w.length > 4 && !/(checked|found|working|normal|condition|status)/.test(w));
      const shared = keys.filter(k => have.includes(k.slice(0, 6))).length;
      if(shared < 2){ push(item.replace(/^(Checked|Tested|Cleaned|Lubricated)\b/, m => 'We have ' + m.toLowerCase())); added++; }
    });
  }
  return {text: out.join('\n'), added};
}
function localTidy(text){ return localRewrite(text, '').text; }

// A short PMS description built from the system and what the notes mention
function pmsFrom(system, text, nature){
  const lines = String(text).split('\n').map(l => l.trim()).filter(Boolean);
  if(nature === 'Complaint'){
    const first = (lines.find(l => l.startsWith('!')) || lines[0] || '').replace(/^!\s*/, '').slice(0, 90);
    return 'Complaint attended' + (system ? ' (' + system + ')' : '') + (first ? ': ' + first : '');
  }
  const body = lines.join(' ');
  const topics = []; PM_TOPICS.forEach(([re, name]) => { if(re.test(body) && !topics.includes(name)) topics.push(name); });
  return 'Preventive Maintenance of ' + (system || 'system') + (topics.length ? ' – ' + topics.slice(0, 4).join(', ') + ' checked' : '');
}
function setPmsDescription(desc){
  const el = document.getElementById('pmsDescInput'); if(!el || !desc) return;
  const v = el.value.trim();
  if(!v || v === (el.dataset.auto || '') || /^(Preventive Maintenance of|Complaint attended)/i.test(v)){ el.value = desc; el.dataset.auto = desc; }
}

async function geminiRewrite(prompt){
  const models = ['gemini-2.5-flash', 'gemini-2.0-flash'];
  let lastErr = null;
  for(const model of models){
    const gen = {maxOutputTokens: 800, temperature: 0.3};
    if(model.startsWith('gemini-2.5')) gen.thinkingConfig = {thinkingBudget: 0};
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
      method: 'POST',
      headers: {'content-type': 'application/json', 'x-goog-api-key': state.geminiKey},
      body: JSON.stringify({contents: [{parts: [{text: prompt}]}], generationConfig: gen})
    });
    if(res.status === 429){ lastErr = new Error('limit'); lastErr.code = 'rate_limited'; break; }
    if(!res.ok){ lastErr = new Error('http ' + res.status); continue; }
    const j = await res.json();
    const text = j && j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts && j.candidates[0].content.parts.map(p => p.text || '').join('');
    if(text && text.trim()) return text;
    lastErr = new Error('empty');
  }
  throw lastErr || new Error('failed');
}

async function rewriteWorkPerformed(){
  const btn = document.getElementById('rewriteBtn');
  const note = document.getElementById('aiNote');
  const systemEl = document.getElementById('systemAttendedInput');
  const workEl = document.getElementById('workPerformedInput');
  if(!workEl || !btn) return;
  const rough = workEl.value.trim();
  if(!rough){ workEl.focus(); if(note) note.textContent = 'Type your rough notes first, then tap Rewrite.'; return; }
  const system = systemEl ? systemEl.value : '';
  const label = btn.innerHTML;
  btn.disabled = true; btn.textContent = 'Rewriting…';
  if(note) note.textContent = '';
  const natureEl = document.querySelector('.modal [name=natureOfCall]');
  const nature = natureEl ? natureEl.value : 'PMS';
  const prompt = [
    'You are helping a field engineer at a CCTV / fire alarm / access control system integration company write the "Work Carried Out" section of a ' + (nature === 'Complaint' ? 'complaint service' : 'preventive maintenance service') + ' report for a ' + (system || 'system') + '.',
    '', 'Rough notes from the engineer:', rough, '',
    'Rewrite these into clear field-report lines, one point per line, matching this tone and register:',
    '"We have checked the gauge pressure of extinguisher, found all are in range"',
    '"32 channel NVR working normal"',
    '"All the accessories are in good condition"', '',
    'Rules:',
    '- Actually rewrite and expand the notes into complete sentences, fixing grammar and spelling. If the notes are very brief, add the usual points a technician checks during a visit for this system, but never invent counts, model numbers or faults.',
    '- One factual point per line, no bullet symbols, no numbering.',
    '- Plain, slightly informal technician English, not corporate-polished.',
    '- If a line describes a fault, a defect, or something not working, start that line with "!" so it can be flagged.',
    '- The very first line must be exactly "PMS: " followed by a short description of the visit (max 12 words), e.g. "PMS: Preventive Maintenance of CCTV, cameras and NVR checked".',
    '- Then output only the report lines. No other heading or preamble.'
  ].join('\n');
  const clean = t => t.split('\n').map(l => l.replace(/^\s*(?:[-*•]|\d+[.)])\s+/, '').trim()).filter(Boolean);
  const apply = (lines, pms, how) => {
    workEl.value = lines.join('\n');
    setPmsDescription(pms || pmsFrom(system, workEl.value, nature));
    if(note) note.textContent = how;
  };
  const useLocal = (why) => {
    const r = localRewrite(rough, system);
    apply(r.text.split('\n'), null, why + (r.added ? ' Added ' + r.added + ' standard checklist point' + (r.added === 1 ? '' : 's') + ' because the notes were short. Delete any you did not do.' : ''));
  };
  try{
    if(SAMPLE || state.geminiKey){
      const raw = SAMPLE ? (await SAMPLE(prompt)).text : await geminiRewrite(prompt);
      let lines = clean(raw), pms = '';
      if(lines.length && /^pms\s*:/i.test(lines[0])){ pms = lines.shift().replace(/^pms\s*:\s*/i, '').trim(); }
      if(!lines.length) throw new Error('empty');
      apply(lines, pms, 'Rewritten with AI. Read it once and edit anything that is not right.');
    } else {
      useLocal('Rewritten with the built-in writer. Add a free Gemini key under Data for smarter AI.');
    }
  }catch(e){
    useLocal((e && e.code === 'rate_limited') ? 'AI limit reached for now, so the built-in writer was used.' : 'Could not reach the AI, so the built-in writer was used.');
  }finally{
    btn.disabled = false; btn.innerHTML = label;
  }
}

function stamp(){ return new Date().toISOString().slice(0,10); }

async function saveFile(filename, data, mime){
  if(DOWNLOADS){
    try{ await DOWNLOADS.save({filename, data}); return true; }
    catch(e){
      if(!e || e.code !== 'declined') toast('Could not save the file in this view.');
      return false;
    }
  }
  const blob = data instanceof Blob ? data : new Blob([data], {type: mime || 'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  return true;
}

function openData(){ state.dataOpen = true; state.dataMsg = null; state.importPending = null; render(); }
function closeData(){ state.dataOpen = false; state.dataMsg = null; state.importPending = null; render(); }

async function exportBackup(){
  const payload = {
    app: 'conx-ops', version: 1, exportedAt: new Date().toISOString(),
    contracts: state.contracts, clients: state.clients, tickets: state.tickets, reports: state.reports, assets: state.assets, notes: state.notes
  };
  const ok = await saveFile(`conx-ops-backup-${stamp()}.json`, JSON.stringify(payload, null, 2), 'application/json');
  if(ok){ state.dataMsg = {kind:'ok', text:'Backup saved. Keep a copy somewhere safe, such as iCloud Drive.'}; render(); }
}

function csvCell(v){
  let s = v == null ? '' : String(v);
  if(/^[=+\-@]/.test(s) && !/^[+-]?[\d\s()-]+$/.test(s)) s = "'" + s; // stop spreadsheet formulas
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportCSV(kind){
  const rows = state[kind];
  if(!rows.length){ state.dataMsg = {kind:'err', text:`No ${kind} to export yet.`}; render(); return; }
  const cols = [];
  rows.forEach(r => Object.keys(r).forEach(k => { if(!cols.includes(k)) cols.push(k); }));
  const lines = [cols.join(',')].concat(rows.map(r => cols.map(c => csvCell(r[c])).join(',')));
  saveFile(`conx-ops-${kind}-${stamp()}.csv`, '﻿' + lines.join('\r\n'), 'text/csv');
}

function handleImportFile(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const d = JSON.parse(reader.result);
      if(!d || d.app !== 'conx-ops') throw new Error('notbackup');
      const pick = k => Array.isArray(d[k]) ? d[k] : [];
      state.importPending = {exportedAt: d.exportedAt, contracts: pick('contracts'), clients: pick('clients'), tickets: pick('tickets'), reports: pick('reports'), assets: pick('assets'), notes: pick('notes')};
      state.dataMsg = null;
    }catch(err){
      state.importPending = null;
      state.dataMsg = {kind:'err', text: err.message === 'notbackup' ? 'That file is not a Conx Ops backup.' : 'Could not read that file. Choose a .json backup made by Conx Ops.'};
    }
    render();
  };
  reader.readAsText(file);
}

async function runPool(jobs, size, onFail){
  let i = 0;
  const worker = async () => {
    while(i < jobs.length){
      const job = jobs[i++];
      try{ await job(); }catch(e){ onFail(e); }
    }
  };
  await Promise.all(Array.from({length: Math.min(size, jobs.length)}, worker));
}

async function applyImport(mode){
  const p = state.importPending;
  if(!p || state.saving) return;
  if(state.readOnly){
    state.dataMsg = {kind:'err', text:'You have view-only access, so you cannot import.'};
    render();
    return;
  }
  if(mode === 'replace' && !p.armed){ p.armed = true; render(); return; }
  state.saving = true;
  state.dataMsg = {kind:'ok', text:'Importing…'};
  render();
  const norm = list => list.filter(x => x && typeof x === 'object').map(x => ({...x, id: String(x.id || cid())}));
  const jobs = [];
  let failed = 0, total = 0;
  for(const kind of KINDS){
    const incoming = norm(p[kind]);
    if(kind === 'clients' && mode === 'merge'){
      const byName = new Map(state.clients.map(c => [(c.name || '').trim().toLowerCase(), c.id]));
      incoming.forEach(c => { const hit = byName.get((c.name || '').trim().toLowerCase()); if(hit) c.id = hit; });
    }
    if(mode === 'replace'){
      const keep = new Set(incoming.map(x => x.id));
      state[kind].filter(x => !keep.has(x.id)).forEach(x => jobs.push(() => removeRecord(kind, x.id)));
    }
    incoming.forEach(x => { total++; jobs.push(() => upsert(kind, x)); });
  }
  let lastErr = null;
  await runPool(jobs, 4, e => { failed++; lastErr = e; });
  state.saving = false;
  state.importPending = null;
  state.dataMsg = failed
    ? {kind:'err', text: `${failed} of ${jobs.length} changes did not save. ${writeError(lastErr)}`}
    : {kind:'ok', text: (mode === 'replace' ? 'Backup restored. ' : 'Backup merged. ') + `Now holding ${state.contracts.length} contracts, ${state.clients.length} clients, ${state.assets.length} assets, ${state.notes.length} notes, ${state.tickets.length} tickets, ${state.reports.length} reports.`};
  render();
}

  const importBlock = p ? `

        </div>

          <div class="data-title">Export to Excel (.csv)</div>
          <div class="data-sub">One file per section.</div>

            <button class="btn btn-ghost" onclick="exportCSV('clients')">Clients</button>
            <button class="btn btn-ghost" onclick="exportCSV('tickets')">Tickets</button>
            <button class="btn btn-ghost" onclick="exportCSV('reports')">Reports</button>
            <button class="btn btn-ghost" onclick="exportCSV('assets')">Assets</button>
          </div>
        </div>
        <div class="data-block">
          <div class="data-title">AI rewrite (free)</div>
          <div class="data-sub">${state.geminiKey ? 'A key is saved, so Rewrite with AI is on for everyone who signs in.' : 'Get a free key at aistudio.google.com (Get API key) and paste it here. Without it, Rewrite does a quick tidy only.'}</div>
          <input id="aiKeyInput" type="password" placeholder="${state.geminiKey ? 'Key saved. Paste a new one to replace' : 'Paste Gemini key'}" autocomplete="off" style="width:100%; box-sizing:border-box; margin-bottom:10px; background:var(--surface-2); border:1px solid var(--line); color:var(--text); padding:12px 14px; border-radius:13px; font-size:15px; font-family:inherit;">
          <div class="data-row"><button class="btn btn-primary" onclick="saveGeminiKey()">Save key</button>${state.geminiKey ? `<button class="btn btn-ghost" onclick="document.getElementById('aiKeyInput').value=''; saveGeminiKey()">Remove</button>` : ''}</div>
        </div>
        <div class="data-block">
          <div class="data-title">Monthly email backup</div>
          <div class="data-sub">A full backup (.json) and reports sheet (.csv) are emailed on the 1st of every month.</div>
          <input id="backupEmailInput" type="email" placeholder="you@example.com" value="${esc(state.backupEmail)}" style="width:100%; box-sizing:border-box; margin-bottom:10px; background:var(--surface-2); border:1px solid var(--line); color:var(--text); padding:12px 14px; border-radius:13px; font-size:15px; font-family:inherit;">
          <div class="data-row">
            <button class="btn btn-primary" onclick="saveBackupEmail()">Save email</button>
            <button class="btn btn-ghost" onclick="sendBackupNow()" ${state.backupBusy ? 'disabled' : ''}>Send a backup now</button>
          </div>
        </div>
        <div class="data-block">
          <div class="data-title">Import backup</div>
          ${importBlock}
        </div>
        <div class="modal-actions"><button type="button" class="btn btn-ghost" onclick="closeData()">Close</button></div>
      </div>
    </div>`;
}
